<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚔️ 배틀 체스 도장</title>
<style>
:root{
  --tilt:58deg; --sq:74px; --zoom:1; --flip:0deg;
  /* 기울어진(그리고 돌려놓은) 판 위에서 캐릭터·이펙트를 정면으로 세운다 */
  --cam:rotateZ(calc(var(--flip)*-1)) rotateX(calc(var(--tilt)*-1));
  --w-armor:#dfe7f0; --w-dark:#7f8d9d; --w-trim:#cfa63c; --w-skin:#c9b39c; --w-cape:#c2a173;
  --b-armor:#414755; --b-dark:#24272f; --b-trim:#a83236; --b-skin:#7d6a5c; --b-cape:#8e2f33;
}
*{box-sizing:border-box}
body{margin:0;padding:14px;min-height:100vh;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;
  background:radial-gradient(130% 95% at 50% -10%,#3a4152 0%,#191c24 55%,#080a0e 100%);
  color:#f6efe2;font:16px/1.5 system-ui,"Malgun Gothic",sans-serif;
  display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start;overflow-x:hidden}
#goal{width:100%;text-align:center;font-size:clamp(19px,3.6vmin,28px);font-weight:800;
  text-shadow:0 3px 0 #000a;min-height:2.7em}
#goal small{display:block;font-weight:500;font-size:.6em;color:#cbbbe4;text-shadow:none}
/* #goal의 입체 그림자는 어두운 배경 위 밝은 글씨용이다. 칩은 배경이 밝고 글씨가 검정이라
   그림자가 글자 3px 아래에 검은 복사본으로 깔려 겹쳐 보인다 — 그래서 끈다. */
.turn{display:inline-flex;align-items:center;gap:.45em;padding:.14em .7em;border-radius:999px;
  font-size:.86em;vertical-align:middle;box-shadow:0 2px 8px #0006;text-shadow:none}
.turn.w{background:#f4f1ea;color:#22201c;border:2px solid #cbbfa8}
.turn.b{background:#1c1b20;color:#f2efe8;border:2px solid #4a4750}
.turn i{width:.8em;height:.8em;border-radius:50%;font-style:normal}
.turn.w i{background:#fff;border:1px solid #b6ab95} .turn.b i{background:#0d0d10;border:1px solid #6b6775}

/* ---------- 3D 무대 ---------- */
/* 기울어진 판은 실제로 화면에서 절반 높이만 차지한다. 레이아웃 상자를 그 높이에 맞춰
   빈 공간을 없애야 조작 패널이 화면 밖으로 밀리지 않는다. */
/* 이 높이는 '레이아웃 흐름용 박스'일 뿐 판을 담는 크기가 아니다 — 판의 실제 투영 높이는
   perspective가 고정 px이라 칸 크기에 비례하지 않는다(칸 1.6배에 투영 1.95배).
   판이 화면 안에 들어오는 보장은 fit()이 실측으로 칸을 줄여서 한다.
   여기 값은 좁은 화면(패널이 아래로 내려가는 <=560px, 이때 칸은 항상 74px)에서
   패널이 밀려나지 않게 하는 용도이고, sq=74에서 원래 값 460px과 같다. */
#stage{perspective:1150px;perspective-origin:50% 58%;position:relative;
  width:calc(var(--sq)*10.4);height:calc(var(--sq)*4.25 + 145px);flex:0 0 auto;zoom:var(--zoom)}
#board{width:calc(var(--sq)*8);height:calc(var(--sq)*8);position:absolute;
  left:50%;margin-left:calc(var(--sq)*-4);top:-66px;
  transform-style:preserve-3d;transform:rotateX(var(--tilt)) rotateZ(var(--flip));
  transition:transform .5s}
#frame{position:absolute;inset:-14px;border-radius:8px;transform:translateZ(-9px);
  background:linear-gradient(#906637,#4a3320);box-shadow:0 50px 70px #000c,0 0 0 3px #24160b}
.sq{position:absolute;width:var(--sq);height:var(--sq)}
.lt{background:linear-gradient(#f6e5c3,#e8d0a0)} .dk{background:linear-gradient(#9c714b,#7b5537)}
/* 지금 움직일 수 있는 말의 발밑이 크게 번쩍인다 — 누구 차례인지, 어느 말을 만질 수 있는지
   판만 봐도 안다. 두께·번짐을 칸 크기(--sq)에 비례시킨다: 고정 px 로 두면 칸이 커졌을 때
   (74→120px) 상대적으로 가늘어져서 잘 안 보인다.
   세 겹이다 — ① 굵은 테두리 ② 칸 안쪽을 채우는 번짐 ③ 칸 밖으로 새어나오는 빛(면적을 키운다) */
.sq::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .25s;
  box-shadow:inset 0 0 0 calc(var(--sq)*.06) var(--turn,#fff),
             inset 0 0 calc(var(--sq)*.36) var(--turn,#fff),
             0 0 calc(var(--sq)*.18) var(--turn,#fff)}
.sq.can::before{opacity:1;animation:canPulse 1.5s ease-in-out infinite}
@keyframes canPulse{50%{opacity:.34}}
.sq::after{content:'';position:absolute;inset:0;opacity:0;transition:opacity .2s}
.sq.dot::after{opacity:1;background:radial-gradient(circle,#41e57d 0 26%,transparent 28%)}
.sq.sel::after{opacity:1;box-shadow:inset 0 0 0 5px #ffd85e,inset 0 0 22px #ffd85e}
.sq.hint::after{opacity:1;background:#ffe45e88;animation:pulse .5s infinite alternate}
.sq.warn::after{opacity:1;box-shadow:inset 0 0 0 5px #ff4a3d;animation:pulse .6s infinite alternate}
.sq.good::after{opacity:1;background:#5fe08a99} .sq.bad::after{opacity:1;background:#ff5a4a99}
/* 반짝이는 말이 어느 칸에 서 있는지도 같이 알려준다(고른 상태보다 옅게).
   내장 3D 모델로 도는 경우엔 그림 반짝임이 없으니 이 테두리가 유일한 표시가 된다.
   다른 상태와 겹칠 때 이기도록 규칙 순서상 뒤에 둔다. */
.sq.hov::after{opacity:1;box-shadow:inset 0 0 0 3px #ffd85eaa,inset 0 0 14px #ffd85e77}
@keyframes pulse{to{opacity:.35}}

/* ---------- 덩어리 = 얇은 원반을 쌓아 만든 둥근 몸통. 위에서 내려다보는 각도라 원반이 겹쳐 매끈해 보인다 ---------- */
.bl{position:absolute;transform-style:preserve-3d}
.bl b{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 33% 26%,rgba(255,255,255,.62),rgba(255,255,255,.05) 46%,
             rgba(0,0,0,.45) 100%),var(--c)}

/* ---------- 캐릭터 뼈대: piece > stand(세우기) > face(방향) > rig(전투) > scale(크기) ---------- */
.piece{position:absolute;left:0;top:0;width:var(--sq);height:var(--sq);
  transform-style:preserve-3d;pointer-events:none;
  transition:transform .55s cubic-bezier(.33,1.1,.5,1),opacity .3s}
/* 손가락으로 캐릭터를 직접 짚을 수 있게 — 말을 고른 뒤엔 목적지 칸이 가려지지 않도록 끈다 */
.spr{pointer-events:auto;cursor:pointer}
body.sel .spr{pointer-events:none}
/* 내장 3D 모델은 고정 px 크기다 — 그림자도 칸 비율(%)이 아니라 고정 px이어야
   칸을 키웠을 때 그림자만 캐릭터보다 커지지 않는다. sq=74의 %값과 같은 크기. */
.shadow{position:absolute;left:50%;top:50%;width:42px;height:36px;margin:-18px 0 0 -21px;
  border-radius:50%;background:#000a;filter:blur(5px);transform:translateZ(1px)}
.stand{position:absolute;left:50%;top:50%;transform-style:preserve-3d;
  transform:rotateX(-90deg)}
.face{position:absolute;transform-style:preserve-3d;transition:transform .3s}
.rig{position:absolute;transform-style:preserve-3d}
.scl{position:absolute;transform-style:preserve-3d;transform:scale(var(--s));
  animation:idle 2.4s ease-in-out infinite}
@keyframes idle{50%{transform:scale(var(--s)) translateY(-3px)}}
.j{position:absolute;transform-style:preserve-3d}
.r{position:absolute;transform-style:preserve-3d}

.walking .legL{animation:step .26s infinite alternate}
.walking .legR{animation:step .26s infinite alternate-reverse}
.walking .armL{animation:swingArm .26s infinite alternate-reverse}
.walking .armR{animation:swingArm .26s infinite alternate}
@keyframes step{from{transform:rotateX(30deg)}to{transform:rotateX(-30deg)}}
@keyframes swingArm{from{transform:rotateX(-20deg)}to{transform:rotateX(20deg)}}

.attack .armR{animation:chop .5s ease-out}
.attack .rig,.rig.lunge{animation:lunge .5s ease-out}
@keyframes chop{0%{transform:none}28%{transform:rotateX(-165deg)}
  52%{transform:rotateX(80deg)}100%{transform:none}}
@keyframes lunge{45%{transform:translateZ(14px)}60%{transform:translateZ(20px) rotateX(-9deg)}
  100%{transform:none}}
.counter .armR{animation:chop .45s ease-out}
.recoil .rig{animation:recoil .34s ease-out}
@keyframes recoil{50%{transform:translateZ(-11px) rotateX(13deg)}100%{transform:none}}
.cheer .armR{animation:cheer .6s ease-out}
@keyframes cheer{40%{transform:rotateX(-150deg)}100%{transform:rotateX(-140deg)}}
.dying .rig{animation:fall .7s forwards ease-in}
@keyframes fall{25%{transform:rotateX(-14deg)}
  100%{transform:rotateX(84deg) translateY(10px)}}
.hit{--armor:#ff6a52;--dark:#c0392b;--trim:#fff2b0;--skin:#ff8f6a}

/* ---------- 스프라이트 캐릭터 (sprites.png, 6열×2행 / 위=흑 아래=백) ---------- */
.spr{position:absolute;left:50%;top:50%;width:72px;height:101px;margin:-101px 0 0 -36px;
  background-image:url(sprites.png);background-size:600% 200%;background-repeat:no-repeat;
  --base:var(--cam) rotateY(var(--fy,0deg)) scaleX(var(--mx,1));
  transform-origin:50% 100%;transform:var(--base);
  filter:drop-shadow(0 5px 7px rgba(0,0,0,.55))}
/* 고른 말만 위아래로 살짝 움직인다 (나머지는 가만히) */
.picked .body,.picked .arm{animation:pickBob .62s ease-in-out infinite alternate}
@keyframes pickBob{from{transform:var(--base)}to{transform:var(--base) translateY(-8px)}}
/* 마우스를 가져가면 '지금 누르면 골라질 말'이 반짝인다.
   잘라낸 그림이라 drop-shadow를 겹치면 캐릭터 윤곽을 따라 빛난다. */
.hov .body,.hov .arm{animation:hovGlow .9s ease-in-out infinite alternate}
@keyframes hovGlow{
  from{filter:drop-shadow(0 5px 7px rgba(0,0,0,.55)) drop-shadow(0 0 4px #ffe58a)}
  to  {filter:drop-shadow(0 5px 7px rgba(0,0,0,.55)) drop-shadow(0 0 10px #ffd24a)
             drop-shadow(0 0 18px #ffb020)}}
/* 몸통 = 절단선 오른쪽, 무기 든 팔 = 왼쪽 조각. 팔은 어깨(--dx,--dy)를 축으로 돈다. */
.body{clip-path:polygon(var(--cx) 0,100% 0,100% 100%,var(--cx) 100%)}
.arm{clip-path:polygon(0 0,var(--cx) 0,var(--cx) 100%,0 100%);
  --base:var(--cam) rotateY(var(--fy,0deg)) scaleX(var(--mx,1)) translateZ(1px);
  --toP:translate(var(--dx),var(--dy));
  --fromP:translate(calc(-1*var(--dx)),calc(-1*var(--dy)));
  transform:var(--base) var(--toP) rotate(var(--ar,0deg)) var(--fromP)}

.walking .body{animation:sbob .26s infinite alternate}
.walking .arm{animation:armWalk .26s infinite alternate}
@keyframes sbob{from{transform:var(--base)}
  to{transform:var(--base) translateY(-5px) rotate(-1.5deg)}}
@keyframes armWalk{from{transform:var(--base) var(--toP) rotate(-16deg) var(--fromP)}
  to{transform:var(--base) var(--toP) rotate(18deg) var(--fromP)}}

.attack .body{animation:satk .5s ease-out}
.attack .arm{animation:armSwing .5s ease-out}
.counter .body{animation:satk .45s ease-out}
.counter .arm{animation:armSwing .45s ease-out}
@keyframes satk{0%{transform:var(--base)}
  26%{transform:var(--base) translateZ(-6px) rotate(-17deg) scale(1.04)}
  50%{transform:var(--base) translateZ(30px) rotate(22deg) scale(1.16)}
  70%{transform:var(--base) translateZ(12px) rotate(6deg) scale(1.06)}
  100%{transform:var(--base)}}
@keyframes armSwing{0%{transform:var(--base) var(--toP) rotate(0deg) var(--fromP)}
  18%{transform:var(--base) var(--toP) rotate(-98deg) translateY(-8px) var(--fromP)}
  44%{transform:var(--base) var(--toP) rotate(76deg) var(--fromP)}
  68%{transform:var(--base) var(--toP) rotate(-18deg) var(--fromP)}
  100%{transform:var(--base) var(--toP) rotate(0deg) var(--fromP)}}

/* 원거리 시전: 무기를 크게 치켜들었다가 앞으로 내지른다 */
.cast .body{animation:scast .62s ease-out}
.cast .arm{animation:armCast .62s ease-out}
@keyframes scast{28%{transform:var(--base) translateZ(-12px) rotate(-9deg)}
  58%{transform:var(--base) translateZ(22px) rotate(11deg) scale(1.08)}
  100%{transform:var(--base)}}
@keyframes armCast{22%{transform:var(--base) var(--toP) rotate(-66deg) translateY(-10px) var(--fromP)}
  55%{transform:var(--base) var(--toP) rotate(34deg) translateX(-16px) var(--fromP)}
  100%{transform:var(--base) var(--toP) rotate(0deg) var(--fromP)}}

/* 맞는 순간: 몸이 뒤로 꺾이며 흔들린다 */
.hit .body,.hit .arm{animation:hitShake .3s}
@keyframes hitShake{0%,100%{transform:var(--base)}
  20%{transform:var(--base) translateX(-9px) rotate(-9deg) scaleY(.94)}
  45%{transform:var(--base) translateX(7px) rotate(7deg)}
  70%{transform:var(--base) translateX(-5px) rotate(-4deg)}}
/* 판 흔들림 */
@keyframes shk{0%,100%{transform:translate(0,0)}
  15%{transform:translate(-8px,5px)}35%{transform:translate(7px,-4px)}
  55%{transform:translate(-5px,-3px)}80%{transform:translate(4px,3px)}}
#stage.shake{animation:shk .3s}

.recoil .body{animation:srec .34s ease-out}
.recoil .arm{animation:armRec .34s ease-out}
@keyframes srec{50%{transform:var(--base) translateZ(-12px) rotate(7deg)}100%{transform:var(--base)}}
@keyframes armRec{45%{transform:var(--base) var(--toP) rotate(4deg) translateX(15px) var(--fromP)}
  100%{transform:var(--base) var(--toP) rotate(0deg) var(--fromP)}}

.cheer .body{animation:schr .6s ease-out}
.cheer .arm{animation:armChr .6s ease-out}
@keyframes schr{40%{transform:var(--base) translateY(-14px) scale(1.06)}100%{transform:var(--base)}}
@keyframes armChr{40%{transform:var(--base) var(--toP) rotate(-48deg) var(--fromP)}
  100%{transform:var(--base) var(--toP) rotate(-34deg) var(--fromP)}}

.slam .body{animation:sslam .75s ease-in}
.slam .arm{animation:armSlam .75s ease-in}
@keyframes sslam{0%{transform:var(--base)}
  35%{transform:var(--base) translateY(-34px) rotate(-13deg) scale(1.05)}
  62%{transform:var(--base) translateY(8px) rotate(9deg) scale(1.09)}
  100%{transform:var(--base)}}
@keyframes armSlam{0%{transform:var(--base) var(--toP) rotate(0deg) var(--fromP)}
  33%{transform:var(--base) var(--toP) rotate(-78deg) translateY(-12px) var(--fromP)}
  60%{transform:var(--base) var(--toP) rotate(56deg) var(--fromP)}
  100%{transform:var(--base) var(--toP) rotate(0deg) var(--fromP)}}

.thrust .body{animation:sthr .3s ease-out}
.thrust .arm{animation:armThr .3s ease-out}
@keyframes sthr{50%{transform:var(--base) translateZ(26px) scale(1.06)}100%{transform:var(--base)}}
@keyframes armThr{50%{transform:var(--base) var(--toP) rotate(8deg) translateX(-18px) var(--fromP)}
  100%{transform:var(--base) var(--toP) rotate(0deg) var(--fromP)}}

.brace .body{animation:sbrc .4s ease-out}
.brace .arm{animation:armBrc .4s ease-out}
@keyframes sbrc{35%{transform:var(--base) translateZ(-16px) rotate(9deg) scaleY(.9) scaleX(1.07)}
  100%{transform:var(--base)}}
@keyframes armBrc{35%{transform:var(--base) var(--toP) rotate(46deg) translateX(-10px) var(--fromP)}
  100%{transform:var(--base) var(--toP) rotate(0deg) var(--fromP)}}

/* ===== 죽는 모습은 '누가 죽였는가'에 따라 다르다 =====
   .dying 에 d-종류 클래스가 함께 붙는다. --dd = 그 죽음이 끝나는 시간(JS의 DEATH 표와 맞춤). */
.dying{--dd:1.5s}
.dying.d-burn{--dd:1.25s} .dying.d-melt{--dd:1.6s} .dying.d-shatter{--dd:1s}
.dying.d-squash{--dd:1.1s} .dying.d-blade{--dd:1.3s}

/* 폰·기본: ① 회색으로 굳고 ② 온몸이 모래가 되고 ③ 바람에 날려 사라진다 */
.dying.d-sand .body,.dying.d-sand .arm{animation:petrify var(--dd) forwards linear;
  -webkit-mask-image:linear-gradient(100deg,#000 0 34%,rgba(0,0,0,.4) 56%,transparent 74%);
          mask-image:linear-gradient(100deg,#000 0 34%,rgba(0,0,0,.4) 56%,transparent 74%);
  -webkit-mask-size:300% 100%;mask-size:300% 100%;
  -webkit-mask-position:0 0;mask-position:0 0}

/* 비숍 감전: 하얗게 번쩍이며 떨다가 검게 타들어가 발밑부터 재가 되어 사라진다.
   mask 는 아래쪽이 투명한 그라디언트를 위로 밀어 올려 '발밑부터 무너지게' 만든다. */
.dying.d-burn .body,.dying.d-burn .arm{animation:burn var(--dd) forwards ease-in;
  -webkit-mask-image:linear-gradient(to top,transparent 0 34%,rgba(0,0,0,.4) 48%,#000 62%);
          mask-image:linear-gradient(to top,transparent 0 34%,rgba(0,0,0,.4) 48%,#000 62%);
  -webkit-mask-size:100% 240%;mask-size:100% 240%;
  -webkit-mask-position:0 0;mask-position:0 0}
@keyframes burn{
  0%  {filter:brightness(4.5) saturate(0) contrast(1.6);
       -webkit-mask-position:0 0;mask-position:0 0}
  8%  {filter:brightness(3.4) saturate(0) contrast(1.9);transform:var(--base) translateX(3px)}
  16% {filter:grayscale(1) brightness(.7) contrast(1.8);transform:var(--base) translateX(-3px)}
  26% {filter:grayscale(1) brightness(.4) contrast(1.9);transform:var(--base) translateX(2px)}
  42% {filter:grayscale(1) brightness(.2) contrast(2);transform:var(--base);
       -webkit-mask-position:0 0;mask-position:0 0}
  72% {filter:grayscale(1) brightness(.08) contrast(2.1);
       -webkit-mask-position:0 52%;mask-position:0 52%}
  100%{filter:grayscale(1) brightness(0) contrast(2.2) blur(2px);opacity:0;
       transform:var(--base) scaleY(.9) translateY(4px);
       -webkit-mask-position:0 100%;mask-position:0 100%}}

/* 퀸 산성탄: 온몸이 완전히 초록으로 변한 뒤 위에서부터 녹아 바닥 웅덩이로 주저앉는다.
   ① 색: hue-rotate 만으로는 안 된다 — 갑옷이 흰·회색(무채색)이라 돌릴 색조가 없다.
      grayscale 로 원래 색을 지우고 sepia 로 모든 픽셀에 색조를 입힌 뒤 초록으로 돌려 진하게 만든다.
   ② 녹는 방향: clip-path 를 쓰면 안 된다 — .body/.arm 의 몸통·팔 분할 clip-path 를 덮어써서
      둘이 각각 전체 그림을 그려 겹쳐 보인다. 그래서 모래 죽음처럼 mask 를 내려 쓸어낸다. */
.dying.d-melt .body,.dying.d-melt .arm{animation:melt var(--dd) forwards ease-in;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0 38%,rgba(0,0,0,.45) 50%,#000 62%);
          mask-image:linear-gradient(to bottom,transparent 0 38%,rgba(0,0,0,.45) 50%,#000 62%);
  -webkit-mask-size:100% 250%;mask-size:100% 250%;
  -webkit-mask-position:0 100%;mask-position:0 100%}
@keyframes melt{
  0%  {filter:none;-webkit-mask-position:0 100%;mask-position:0 100%}
  16% {filter:grayscale(1) sepia(1) hue-rotate(75deg) saturate(5.5) brightness(1);
       transform:var(--base);-webkit-mask-position:0 100%;mask-position:0 100%}
  30% {filter:grayscale(1) sepia(1) hue-rotate(75deg) saturate(6.5) brightness(1.1);
       transform:var(--base) scaleY(.95) scaleX(1.05);
       -webkit-mask-position:0 100%;mask-position:0 100%}
  70% {filter:grayscale(1) sepia(1) hue-rotate(78deg) saturate(6.5) brightness(.85) blur(1px);
       transform:var(--base) scaleY(.52) scaleX(1.22);
       -webkit-mask-position:0 40%;mask-position:0 40%}
  100%{filter:grayscale(1) sepia(1) hue-rotate(80deg) saturate(6.5) brightness(.7) blur(2.5px);
       transform:var(--base) scaleY(.07) scaleX(1.42) translateY(5px);opacity:.2;
       -webkit-mask-position:0 0;mask-position:0 0}}

/* 룩 대포: 몸은 섬광과 함께 순식간에(0.25초) 사라지고, 그림을 잘라 만든 조각들이 날아간다.
   d-shatter 의 --dd 는 조각이 날아가는 시간(0.95초)까지 잡아 둔다 — 그래야 조각이 잘리지 않는다. */
.dying.d-shatter .body,.dying.d-shatter .arm{animation:blowUp var(--dd) forwards ease-out}
@keyframes blowUp{
  0%  {filter:none}
  8%  {filter:brightness(7) contrast(1.9);transform:var(--base) scale(1.18)}
  25% {filter:brightness(3) blur(4px);opacity:0;transform:var(--base) scale(1.5) rotate(7deg)}
  100%{opacity:0;transform:var(--base) scale(1.5)}}
/* 조각 = 캐릭터 그림을 부채꼴로 잘라낸 복제본. 방향(--fx,--fy)과 회전(--fr)은 JS가 준다. */
.chunk{animation:chunkFly .95s ease-out forwards}
@keyframes chunkFly{
  0%  {transform:var(--base);opacity:1}
  45% {transform:var(--base) translate(calc(var(--fx)*.6),calc(var(--fy)*.6 - 16px))
       rotate(calc(var(--fr)*.5)) scale(.95);opacity:1}
  100%{transform:var(--base) translate(var(--fx),calc(var(--fy) + 30px))
       rotate(var(--fr)) scale(.7);opacity:0}}

/* 나이트 내리찍기: 발밑을 축으로 납작하게 짜부러진다 (transform-origin이 50% 100%) */
.dying.d-squash .body,.dying.d-squash .arm{animation:squash var(--dd) forwards}
@keyframes squash{
  0%  {transform:var(--base)}
  13% {transform:var(--base) scaleY(.17) scaleX(1.48);filter:brightness(.85) contrast(1.25)}
  28% {transform:var(--base) scaleY(.28) scaleX(1.32)}
  52% {transform:var(--base) scaleY(.2) scaleX(1.42);filter:grayscale(.5) brightness(.7)}
  100%{transform:var(--base) scaleY(.09) scaleX(1.52) translateY(3px);opacity:0;
       filter:grayscale(1) brightness(.45)}}

/* 킹의 던진 칼: 맞고 휘청이다 뒤로 넘어간다 */
.dying.d-blade .body,.dying.d-blade .arm{animation:pierced var(--dd) forwards}
@keyframes pierced{
  0%  {transform:var(--base)}
  9%  {transform:var(--base) translateY(-5px) rotate(5deg);filter:brightness(2.4) saturate(.5)}
  26% {transform:var(--base) rotate(-7deg)}
  55% {transform:var(--base) rotate(-18deg) translateY(7px);filter:grayscale(.45) brightness(.8)}
  100%{transform:var(--base) rotate(-74deg) translateY(28px) scaleY(.92);opacity:0;
       filter:grayscale(1) brightness(.45)}}
@keyframes petrify{
  0%  {filter:none;transform:var(--base)}
  6%  {transform:var(--base) translateX(-5px) scaleY(.97)}          /* 굳는 순간 움찔 */
  24% {filter:grayscale(1) brightness(.78) contrast(1.15);          /* ① 회색 석화 */
       transform:var(--base)}
  30% {-webkit-mask-position:0 0;mask-position:0 0}
  52% {filter:grayscale(1) sepia(1) saturate(2.2) brightness(1.1) contrast(.85) blur(.6px);
       transform:var(--base) translateY(2px)}                       /* ② 모래로 변함 */
  100%{filter:grayscale(1) sepia(1) saturate(2.6) brightness(1.25) blur(2px);
       transform:var(--base) translateX(30px) translateY(-6px) skewX(-14deg) scale(1.03);
       opacity:0;-webkit-mask-position:100% 0;mask-position:100% 0}}/* ③ 바람에 흩날림 */
.dying .sshadow{animation:shadeOut var(--dd) forwards}
@keyframes shadeOut{40%{opacity:.3;filter:brightness(0) blur(5px)}
  to{opacity:0;transform:skewX(-34deg) scaleY(.5) translateX(30px) scale(.8)}}
.hit .spr{filter:brightness(2.6) saturate(3) sepia(.35) hue-rotate(-25deg)}

/* 판에 드리우는 실루엣 그림자 — 캐릭터가 판 위에 실제로 서 있는 느낌을 준다 */
.sshadow{position:absolute;left:50%;top:50%;width:72px;height:101px;margin:-101px 0 0 -36px;
  background-image:url(sprites.png);background-size:600% 200%;background-repeat:no-repeat;
  transform-origin:50% 100%;transform:skewX(-34deg) scaleY(.5) scaleX(var(--mx,1));
  filter:brightness(0) blur(3px);opacity:.4}

/* 공격 연출 */
.slash{position:absolute;left:50%;top:34%;width:130px;height:130px;margin:-65px 0 0 -65px;
  pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 28%,#eaf6ff 40%,#fff 48%,#9fd8ff 54%,transparent 66%);
  -webkit-mask:radial-gradient(circle,transparent 42%,#000 45%,#000 63%,transparent 66%);
          mask:radial-gradient(circle,transparent 42%,#000 45%,#000 63%,transparent 66%);
  animation:slash .38s ease-out forwards}
@keyframes slash{
  0%{opacity:0;transform:var(--cam) rotate(calc(var(--a) - 75deg)) scale(.55)}
  30%{opacity:1}
  100%{opacity:0;transform:var(--cam) rotate(calc(var(--a) + 85deg)) scale(1.3)}}
.muzzle{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;pointer-events:none;
  background:radial-gradient(circle,#fff 0 16%,#ffdf6a 30%,#ff7a1a 52%,transparent 72%);
  animation:muz .32s ease-out forwards}
@keyframes muz{0%{transform:var(--cam) scale(.2);opacity:1}
  30%{transform:var(--cam) scale(1.5)}
  100%{transform:var(--cam) scale(.8);opacity:0}}
.ball{position:absolute;width:var(--sq);height:var(--sq);pointer-events:none;
  transition:transform var(--fly) linear}
.ball i{position:absolute;left:50%;top:46%;width:var(--bs,18px);height:var(--bs,18px);
  margin:calc(var(--bs,18px)/-2);border-radius:50%;background:var(--bg2);
  box-shadow:0 0 16px var(--gl);animation:arc var(--fly) ease-in-out}
@keyframes arc{50%{transform:translateZ(56px) scale(1.2)}}
.ring{position:absolute;width:var(--sq);height:var(--sq);border-radius:50%;pointer-events:none;
  border:5px solid var(--rc,#ffb347);box-shadow:0 0 20px var(--rc,#ffb347);
  animation:ringout .7s ease-out forwards}
@keyframes ringout{from{transform:scale(.15);opacity:1}to{transform:scale(3.2);opacity:0}}
.fx.slow b{animation-duration:1.15s}

/* 비숍 감전 — 방어자를 감싸는 지지직거리는 전기 다발.
   지그재그로 오린 밝은 막대를 여러 개 겹치고, 각자 다른 박자로 껐다 켠다. */
.zap{position:absolute;width:var(--sq);height:var(--sq);pointer-events:none}
.zap b{position:absolute;left:50%;top:42%;width:var(--zw,7px);height:var(--zh,64px);
  margin:calc(var(--zh,64px)/-2) 0 0 calc(var(--zw,7px)/-2);
  background:linear-gradient(#fff,#cdefff 45%,#7fd0ff);
  box-shadow:0 0 8px #bfe9ff,0 0 20px #7fd0ff;
  clip-path:polygon(38% 0,62% 18%,44% 34%,68% 52%,46% 68%,64% 84%,42% 100%,
                    30% 84%,50% 68%,26% 52%,52% 34%,30% 18%);
  transform:var(--cam) rotate(var(--zr,0deg)) translate(var(--zx,0),var(--zy,0));
  animation:zapFlick var(--zd,.5s) linear var(--zt,0s) forwards}
@keyframes zapFlick{0%{opacity:0} 12%{opacity:1} 28%{opacity:.15} 44%{opacity:1}
  60%{opacity:.1} 76%{opacity:.95} 100%{opacity:0}}
/* 감전된 몸 — 하얗게 번쩍이며 좌우로 떤다 */
.shock .body,.shock .arm{animation:shockJit .09s linear infinite}
@keyframes shockJit{
  0%  {filter:brightness(2.8) saturate(.25) drop-shadow(0 0 8px #9fdcff);
       transform:var(--base) translateX(-2px)}
  50% {filter:brightness(4.4) saturate(0) drop-shadow(0 0 15px #cdefff);
       transform:var(--base) translateX(2px)}
  100%{filter:brightness(2.8) saturate(.25) drop-shadow(0 0 8px #9fdcff);
       transform:var(--base) translateX(-1px)}}

/* 퀸 산성 웅덩이 — 판에 눕는다(--cam 없음). 몸이 주저앉는 동안 함께 커져서
   마지막엔 웅덩이만 남은 것처럼 보이게 늦게 최대가 된다. */
.pool{position:absolute;width:var(--sq);height:var(--sq);pointer-events:none}
.pool i{position:absolute;left:50%;top:50%;width:66px;height:33px;margin:-16.5px 0 0 -33px;
  border-radius:50%;filter:blur(1.5px);
  background:radial-gradient(circle,#dcffc4 0 24%,#7ff06a 48%,#2fae4a 74%,#12622e 100%);
  animation:poolOut 1.9s ease-out forwards}
@keyframes poolOut{
  0%  {transform:scale(.1);opacity:.45}
  30% {transform:scale(.6);opacity:.9}
  62% {transform:scale(1);opacity:.95}
  82% {transform:scale(1.15);opacity:.9}
  100%{transform:scale(1.22);opacity:0}}

/* 킹이 던지는 칼 — .ball 의 포물선(arc)은 그대로 두고 회전만 ::before 로 얹는다.
   같은 요소에 두 애니메이션을 걸면 transform 이 서로를 덮어써서 궤적이 사라진다. */
.ball.blade i{background:none;box-shadow:none}
.ball.blade i::before{content:'';position:absolute;left:50%;top:50%;
  width:40px;height:8px;margin:-4px 0 0 -20px;border-radius:2px;
  background:linear-gradient(#fff,#d7e8f6 45%,#7f93a6);box-shadow:0 0 12px #d8efff;
  animation:bladeSpin var(--fly) linear}
@keyframes bladeSpin{from{transform:var(--cam) rotate(0deg)}to{transform:var(--cam) rotate(1080deg)}}
/* 몸에 박힌 칼 */
.stuck{position:absolute;width:34px;height:7px;margin:-3.5px 0 0 -17px;border-radius:2px;
  pointer-events:none;background:linear-gradient(#fff,#cfe0ee 45%,#78899a);
  box-shadow:0 0 8px #cfe8ff;animation:stuckIn .9s ease-out forwards}
@keyframes stuckIn{
  0%  {opacity:0;transform:var(--cam) rotate(-24deg) translateX(-20px) scale(1.3)}
  12% {opacity:1;transform:var(--cam) rotate(-24deg) translateX(0) scale(1)}
  100%{opacity:0;transform:var(--cam) rotate(-32deg) translateY(18px)}}

/* 나이트 — 도약해서 내리찍기. --base 뒤의 translateY 는 화면상 위아래다(pickBob과 같은 방식) */
.jump .body,.jump .arm{animation:jumpSlam .72s ease-in-out forwards}
@keyframes jumpSlam{
  0%  {transform:var(--base)}
  26% {transform:var(--base) translateY(-52px) rotate(-9deg) scaleY(1.05)}
  44% {transform:var(--base) translateY(-58px) rotate(-4deg)}
  66% {transform:var(--base) translateY(6px) rotate(8deg) scaleY(.9) scaleX(1.06)}
  80% {transform:var(--base) translateY(0) scaleY(1.03)}
  100%{transform:var(--base)}}

/* ---------- 효과 (카메라를 향하는 빌보드) ---------- */
.fx,.marker{position:absolute;width:var(--sq);height:var(--sq);pointer-events:none;
  transform-style:preserve-3d}
.fx b{position:absolute;left:50%;top:40%;width:var(--sz);height:var(--sz);margin:calc(var(--sz)/-2);
  border-radius:50%;background:radial-gradient(circle,#fff 0 22%,var(--sc) 45%,transparent 72%);
  transform:var(--cam) translate(var(--dx),var(--dy)) scale(0);
  animation:spark .7s ease-out forwards}
@keyframes spark{18%{transform:var(--cam) translate(0,0) scale(1.7)}
  100%{transform:var(--cam) translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* 룩 대포에 맞아 튀는 조각 — 둥근 입자 대신 각진 파편으로 돌면서 날아간다 */
.fx.frag b{border-radius:2px;box-shadow:0 0 5px #0008;
  background:linear-gradient(135deg,#eef3f8 0 42%,#93a0ae 43%,#5c6874);
  animation:fragFly .9s ease-out forwards}
@keyframes fragFly{
  0%  {transform:var(--cam) translate(0,0) rotate(0deg) scale(.2);opacity:1}
  14% {transform:var(--cam) translate(calc(var(--dx)*.28),calc(var(--dy)*.28)) rotate(70deg) scale(1)}
  100%{transform:var(--cam) translate(var(--dx),var(--dy)) rotate(340deg) scale(.8);opacity:0}}
.marker i{position:absolute;left:50%;top:22%;margin-left:-16px;font-size:32px;font-style:normal;
  color:#ffd85e;text-shadow:0 0 12px #ff9d00,0 3px 0 #000;
  transform:var(--cam);animation:float 1.2s ease-in-out infinite alternate}
@keyframes float{to{transform:var(--cam) translateY(-14px) rotate(12deg)}}
/* ---------- 승리 축하: 화면 가운데 폭죽 + 통통 튀는 글씨 ---------- */
#win{position:fixed;inset:0;z-index:40;overflow:hidden;cursor:pointer;
  background:radial-gradient(60% 50% at 50% 45%,#0b0f1a55,#0b0f1aaa);
  transition:opacity .45s}
#win.out{opacity:0}
/* 폭죽 한 발 = 사방으로 퍼지는 불꽃. rotate 로 방향을 잡고 translateX 로 밀어내면
   각도마다 다른 방향이 된다. 맨 앞 translateY 는 회전 전이라 화면 아래쪽(중력) 몫이다. */
.fw{position:absolute;width:0;height:0}
.fw b{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px;border-radius:50%;
  background:radial-gradient(circle,#fff 0 28%,var(--fwc) 62%,transparent 72%);
  box-shadow:0 0 12px var(--fwc),0 0 26px var(--fwc);
  animation:fwFly 1.2s ease-out var(--fwd) both}
@keyframes fwFly{
  0%  {transform:rotate(var(--a)) translateX(0) scale(.25);opacity:0}
  10% {opacity:1}
  55% {transform:translateY(6px) rotate(var(--a)) translateX(calc(var(--r)*.8)) scale(1.05);opacity:1}
  100%{transform:translateY(34px) rotate(var(--a)) translateX(var(--r)) scale(.3);opacity:0}}
/* 글씨 — 만화처럼 두껍게 눌러 찍은 금색. 한 자씩 톡톡 튀어나온 뒤 계속 살랑인다. */
.wintext{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:flex-end;gap:.04em;white-space:nowrap;
  font-size:clamp(42px,11vmin,108px);font-weight:900;letter-spacing:-.02em}
.wintext span{display:block;color:#ffe14a;
  text-shadow:0 3px 0 #c8781a,0 6px 0 #8a4a08,0 0 20px #ffb020,0 10px 26px #0009;
  animation:winPop .6s cubic-bezier(.2,1.75,.4,1) var(--d) both,
            winBob 1.6s ease-in-out calc(var(--d) + .6s) infinite}
.wintext span.sp{width:.34em;animation:none}
@keyframes winPop{
  0%  {transform:translateY(46px) scale(.2) rotate(-16deg);opacity:0}
  60% {transform:translateY(-12px) scale(1.2) rotate(5deg);opacity:1}
  100%{transform:none;opacity:1}}
@keyframes winBob{50%{transform:translateY(-11px) rotate(-3deg)}}
/* 가운데 정렬을 transform 으로 하면 안 된다 — winPop 의 마지막 키프레임이 transform:none 이라
   애니메이션이 끝나는 순간 정렬이 지워져 오른쪽으로 밀린다. 좌우를 0으로 펴고 text-align 으로 맞춘다. */
.winsub{position:absolute;left:0;right:0;top:50%;
  margin-top:clamp(46px,8vmin,86px);text-align:center;white-space:nowrap;
  font-size:clamp(15px,2.6vmin,22px);font-weight:700;color:#fff3d0;
  text-shadow:0 2px 0 #000a,0 0 14px #ffb02066;
  animation:winPop .6s cubic-bezier(.2,1.6,.4,1) .5s both}

/* 연출 시험 막대 — 주소 끝에 ?fx 를 붙였을 때만 만들어진다 */
#fxlab{position:fixed;left:10px;bottom:10px;z-index:30;display:flex;gap:6px;align-items:center;
  flex-wrap:wrap;max-width:calc(100vw - 20px);font-size:12px;color:#fafafa;
  background:#18181bdd;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 10px}
#fxlab button{font:inherit;padding:5px 9px;border-radius:7px;cursor:pointer;
  background:#27272a;color:#e4e4e7;border:1px solid rgba(255,255,255,.12)}
#fxlab button:hover{color:#fff;background:#3f3f46}

.pop{position:absolute;width:var(--sq);text-align:center;font-weight:900;font-size:22px;
  color:#ffd85e;text-shadow:0 2px 0 #000;pointer-events:none;
  transform:var(--cam);animation:pop 1.2s ease-out forwards}
@keyframes pop{100%{transform:var(--cam) translateY(-80px);opacity:0}}

/* ---------- 메뉴: shadcn/ui 디자인 토큰(zinc 다크)과 Card·Tabs·Button 구조를 그대로 옮김 ---------- */
#panel{
  --card:#18181b; --card-fg:#fafafa; --muted:#27272a; --muted-fg:#a1a1aa;
  --border:rgba(255,255,255,.10); --primary:#e4e4e7; --primary-fg:#18181b;
  --secondary:#27272a; --accent:#27272a; --bg:#09090b; --radius:.625rem;
  position:relative;
  width:300px;flex:0 0 300px;
  display:flex;flex-direction:column;gap:1rem;padding:1.25rem 0;
  background:var(--card);color:var(--card-fg);
  border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);
  box-shadow:0 1px 2px rgba(0,0,0,.4);font-size:14px}
.card-header{display:flex;flex-direction:column;gap:.5rem;padding:0 1.25rem;
  cursor:grab;touch-action:none}
.card-header:active{cursor:grabbing}
.card-header .tabs,.card-header button{cursor:pointer;touch-action:manipulation}
#panel.moved{position:fixed;z-index:20;margin:0}
/* 접기 버튼 — 헤더의 드래그 처리기는 button을 무시하므로 눌러도 판이 끌리지 않는다 */
.minbtn{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:8px;background:var(--muted);
  color:var(--muted-fg);font:inherit;font-size:18px;line-height:1;cursor:pointer}
.minbtn:hover{color:var(--card-fg)}
/* 접힌 모습: 우측 상단에 떠 있는 작은 바.
   흐름에서 완전히 빠지므로 판이 가로를 다 쓰고, 큰 안내문(#goal)을 이 바 안으로
   옮겨 담기 때문에 안내문이 쓰던 세로 공간까지 판으로 넘어간다. */
#panel.min{position:fixed;top:10px;right:10px;left:auto;z-index:20;
  width:auto;max-width:min(320px,calc(100vw - 20px));flex:0 0 auto;
  gap:0;padding:.5rem 0}
#panel.min .sep,#panel.min .card-content,#panel.min .card-desc,
#panel.min .tabs,#panel.min .grip,#panel.min .card-title,
#panel.min #goal small{display:none}
#panel.min .card-header{padding:0 2.4rem 0 .9rem;gap:0}
/* 바 안에서는 판 위의 큰 글씨가 아니라 한 줄짜리 상태 표시가 된다 */
#panel.min #goal{width:auto;min-height:0;text-align:left;
  font-size:15px;font-weight:700;text-shadow:none;line-height:1.35}
.grip{align-self:center;width:36px;height:4px;border-radius:999px;background:var(--border);
  margin:-.5rem 0 .25rem}
.card-title{font-weight:600;font-size:16px;line-height:1}
.card-desc{font-size:13px;color:var(--muted-fg)}
.card-content{display:flex;flex-direction:column;gap:.5rem;padding:0 1.25rem}
.sep{height:1px;background:var(--border)}
.label{font-size:12px;font-weight:500;color:var(--muted-fg);margin-top:.25rem}
.hint-text{opacity:.6;font-weight:400}
.muted{font-size:12.5px;color:var(--muted-fg);line-height:1.5;margin:0}
.tabs,.seg{display:inline-flex;width:100%;height:36px;padding:3px;
  background:var(--muted);border-radius:var(--radius);color:var(--muted-fg)}
.tab,.seg>button{flex:1;display:inline-flex;align-items:center;justify-content:center;

<script>
/* ================= 체스 기본기 (판 = 길이 64 배열, 대문자=백, 소문자=흑) ================= */
const ID=(r,c)=>r*8+c, RC=i=>[i>>3,i&7], isW=p=>p===p.toUpperCase();
const D={n:[[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]],
         b:[[1,1],[1,-1],[-1,1],[-1,-1]], r:[[1,0],[-1,0],[0,1],[0,-1]]};
D.q=D.k=D.b.concat(D.r);

// atk=true면 아군 말이 있는 칸도 포함(수비 여부 판정용), 폰은 대각선만
function moves(bd,i,atk){
  const p=bd[i]; if(!p) return [];
  const [r,c]=RC(i), w=isW(p), t=p.toLowerCase(), out=[];
  if(t==='p'){
    const d=w?-1:1;
    for(const dc of [-1,1]){
      const rr=r+d, cc=c+dc;
      if(rr<0||rr>7||cc<0||cc>7) continue;
      const q=bd[ID(rr,cc)];
      if(atk||(q&&isW(q)!==w)) out.push(ID(rr,cc));
    }
    if(!atk&&r+d>=0&&r+d<8&&!bd[ID(r+d,c)]){
      out.push(ID(r+d,c));
      if(r===(w?6:1)&&!bd[ID(r+2*d,c)]) out.push(ID(r+2*d,c));
    }
    return out;
  }
  const slide='brq'.includes(t);
  const add=(r,c)=>{
    if(r<0||r>7||c<0||c>7) return false;
    const q=bd[ID(r,c)];
    if(q&&isW(q)===w){ if(atk) out.push(ID(r,c)); return false; }
    out.push(ID(r,c));
    return !q;
  };
  for(const [dr,dc] of D[t]){ let rr=r+dr, cc=c+dc;
    while(add(rr,cc)&&slide){ rr+=dr; cc+=dc; } }
  return out;
}
const attacked=(bd,sq,byW)=>bd.some((p,i)=>p&&isW(p)===byW&&moves(bd,i,true).includes(sq));

// 킹은 공격받는 칸으로 못 감. 핀은 무시 — 이 드릴엔 안 나옴.
function legal(bd,i){
  const p=bd[i], m=moves(bd,i);
  if(p.toLowerCase()!=='k') return m;
  return m.filter(d=>{const b=bd.slice();b[d]=p;b[i]='';return !attacked(b,d,!isW(p));});
}
const play=(bd,f,t)=>{const b=bd.slice();b[t]=b[f];b[f]='';return b;};

function isMate(bd,k){                                  // 흑 킹 k 가 메이트인가
  if(!attacked(bd,k,true)) return false;
  const [r,c]=RC(k), naked=bd.slice(); naked[k]='';      // 체크선이 킹을 통과하도록
  for(const [dr,dc] of D.k){
    const rr=r+dr, cc=c+dc;
    if(rr<0||rr>7||cc<0||cc>7) continue;
    const s=ID(rr,cc);
    if(bd[s]&&!isW(bd[s])) continue;
    const b=naked.slice(); b[s]='k';
    if(!attacked(b,s,true)) return false;                // 도망갈 칸 있음
  }
  return true;
}

/* ================= 문제 생성기 (코드로 검증해 만들기 때문에 오답 문제가 없음) ================= */
const rnd=n=>Math.random()*n|0;
const NAME={K:'킹',Q:'퀸',R:'룩',B:'비숍',N:'나이트',P:'폰'};
const TIP={K:'킹은 어느 방향이든 한 칸!',Q:'퀸은 어느 방향이든 쭉!',R:'룩은 직선으로 쭉!',
           B:'비숍은 대각선으로 쭉!',N:'나이트는 L자 (2칸 가고 1칸 꺾기)!',P:'폰은 앞으로, 잡을 땐 대각선!'};
const spots=n=>{const s=[];while(s.length<n){const i=rnd(64);if(!s.includes(i))s.push(i);}return s;};
const adj=(a,b)=>{const [r1,c1]=RC(a),[r2,c2]=RC(b);return Math.abs(r1-r2)<2&&Math.abs(c1-c2)<2;};

function genMove(){
  const p='NBRQKP'[rnd(6)], i=rnd(64);
  if(p==='P'&&(i>>3)<2) return null;                     // 폰 승진 상황은 제외
  const bd=Array(64).fill(''); bd[i]=p;
  const m=moves(bd,i); if(!m.length) return null;
  const t=m[rnd(m.length)];
  return {bd,ans:new Set([i+'-'+t]),star:[t],sel:i,
          text:`${NAME[p]} 기사를 ★ 칸으로 보내세요`,sub:TIP[p],tip:TIP[p]};
}
function genCapture(){
  const p='NBRQ'[rnd(4)], sq=spots(4), bd=Array(64).fill('');
  bd[sq[0]]=p; for(let k=1;k<4;k++) bd[sq[k]]='nbrq'[rnd(4)];
  const hits=moves(bd,sq[0]).filter(d=>bd[d]);
  if(hits.length!==1) return null;
  if(attacked(play(bd,sq[0],hits[0]),hits[0],false)) return null;   // 지켜지는 말이면 공짜 아님
  return {bd,ans:new Set([sq[0]+'-'+hits[0]]),sel:sq[0],
          text:'공짜로 잡을 수 있는 적을 쓰러뜨리세요 ⚔️',
          sub:'지켜주는 동료가 없는 적만 안전해요',
          tip:'적을 잡기 전에 "누가 지켜주나?"를 꼭 보세요.'};
}
function genSave(){
  const p='NBRQ'[rnd(4)], sq=spots(3), bd=Array(64).fill('');
  bd[sq[0]]=p; bd[sq[1]]='nbrq'[rnd(4)]; bd[sq[2]]='nbrq'[rnd(4)];
  if(!attacked(bd,sq[0],false)) return null;
  const safe=moves(bd,sq[0]).filter(d=>!attacked(play(bd,sq[0],d),d,false));
  if(!safe.length) return null;
  const foe=bd.map((q,i)=>q&&!isW(q)&&moves(bd,i,true).includes(sq[0])?i:-1).filter(i=>i>=0);
  return {bd,ans:new Set(safe.map(d=>sq[0]+'-'+d)),sel:sq[0],warn:[sq[0],...foe],
          text:'우리 기사가 위험해요! 안전한 칸으로 피하세요 🛡️',
          sub:'빨간 칸 = 위험',tip:'상대가 두면 내 말이 잡히는지 매번 확인!'};
}
function genFork(){
  const sq=spots(4), bd=Array(64).fill('');
  bd[sq[0]]='N'; bd[sq[1]]='k'; bd[sq[2]]='q'; bd[sq[3]]='rbq'[rnd(3)];
  if(adj(sq[1],sq[0])||attacked(bd,sq[1],true)) return null;   // 처음부터 체크면 안 됨
  const good=moves(bd,sq[0]).filter(d=>{
    if(bd[d]) return false;
    const b=play(bd,sq[0],d);
    if(attacked(b,d,false)) return false;                      // 포크 놓고 잡히면 실패
    return moves(b,d).filter(x=>b[x]).length>=2;
  });
  if(!good.length) return null;
  return {bd,ans:new Set(good.map(d=>sq[0]+'-'+d)),sel:sq[0],
          text:'나이트로 한 번에 둘을 노리세요 (포크!) 🐴',
          sub:'내가 잡히지 않는 칸으로',tip:'나이트 포크는 킹 + 큰 말을 동시에 노리는 게 최고!'};
}
function genMate(){
  const sq=spots(3), bd=Array(64).fill('');
  bd[sq[0]]='K'; bd[sq[1]]='Q'; bd[sq[2]]='k';
  if(adj(sq[0],sq[2])||attacked(bd,sq[2],true)) return null;
  const ans=new Set();
  bd.forEach((p,i)=>{ if(p&&isW(p))
    legal(bd,i).forEach(d=>{ if(isMate(play(bd,i,d),sq[2])) ans.add(i+'-'+d); }); });
  if(!ans.size) return null;
  return {bd,ans,text:'한 수로 체크메이트! 👑',
          sub:'적 왕이 도망갈 칸이 하나도 없게',
          tip:'퀸으로 가둘 땐 내 킹이 퀸을 지켜줘야 해요.',mate:sq[2]};
}
const STAGES=[
  {id:'move',   name:'1. 말 움직이기', gen:genMove},
  {id:'capture',name:'2. 공짜 말 잡기', gen:genCapture},
  {id:'save',   name:'3. 내 말 살리기', gen:genSave},
  {id:'fork',   name:'4. 나이트 포크',  gen:genFork},
  {id:'mate',   name:'5. 한 수 메이트', gen:genMate},
];

/* ================= 정식 대국 (체스 규칙 전부: 캐슬링·앙파상·승진·체크메이트) ================= */
const START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';
const VAL={p:100,n:320,b:330,r:500,q:900,k:20000};
const fromFen=f=>{const bd=Array(64).fill('');let i=0;
  for(const ch of f){ if(ch==='/')continue; if(ch>='1'&&ch<='8') i+=+ch; else bd[i++]=ch; } return bd;};
const inCheck=(bd,w)=>attacked(bd,bd.indexOf(w?'K':'k'),!w);

function apply(bd,f,t,g){                       // 특수 규칙까지 반영한 실제 이동
  const b=bd.slice(), p=b[f], lo=p.toLowerCase(), w=isW(p);
  b[t]=p; b[f]='';
  if(lo==='p'){
    if(t===g.ep) b[t+(w?8:-8)]='';              // 앙파상: 지나친 폰을 잡는다
    if((t>>3)===(w?0:7)) b[t]=w?'Q':'q';        // 승진 (퀸 고정)
  }
  if(lo==='k'&&Math.abs((t&7)-(f&7))===2){      // 캐슬링: 룩도 함께 옮긴다
    const r=t>f?f+3:f-4, nr=t>f?t-1:t+1; b[nr]=b[r]; b[r]='';
  }
  return b;
}
function nextState(bd,f,t,g){                   // 캐슬링 권리와 앙파상 칸 갱신
  const p=bd[f], lo=p.toLowerCase(), w=isW(p), ng={ep:-1,castle:g.castle,turn:w?'b':'w'};
  if(lo==='p'&&Math.abs((t>>3)-(f>>3))===2) ng.ep=(f+t)>>1;
  const drop=s=>ng.castle=ng.castle.replace(s,'');
  if(lo==='k'){ if(w){drop('K');drop('Q');} else {drop('k');drop('q');} }
  [[63,'K'],[56,'Q'],[7,'k'],[0,'q']].forEach(([sq,s])=>{ if(f===sq||t===sq) drop(s); });
  return ng;
}
function genMoves(bd,w,g){
  const out=[];
  bd.forEach((p,i)=>{
    if(!p||isW(p)!==w) return;
    const lo=p.toLowerCase(); let ds=moves(bd,i);
    if(lo==='p'&&g.ep>=0){                      // 앙파상 잡기
      const [r,c]=RC(i),[er,ec]=RC(g.ep);
      if(er===r+(w?-1:1)&&Math.abs(ec-c)===1) ds=ds.concat(g.ep);
    }
    if(lo==='k'&&i===(w?60:4)&&!inCheck(bd,w)){ // 캐슬링
      const free=s=>!bd[s]&&!attacked(bd,s,!w);
      if(g.castle.includes(w?'K':'k')&&free(i+1)&&free(i+2)&&bd[i+3]===(w?'R':'r')) ds=ds.concat(i+2);
      if(g.castle.includes(w?'Q':'q')&&free(i-1)&&free(i-2)&&!bd[i-3]&&bd[i-4]===(w?'R':'r')) ds=ds.concat(i-2);
    }
    ds.forEach(d=>out.push([i,d]));
  });
  /* 정식 체스에서는 내 킹이 잡히게 되는 수를 둘 수 없다 — 아래 걸러내기가 그것이다.
     '실수 허용' 규칙에서는 이 걸러내기를 하지 않는다: 왕이 위험한 칸에도 갈 수 있고,
     체크를 무시하거나 핀된 말을 움직여 왕을 노출시킬 수도 있다. 아이가 실수를 해 보고
     그 결과로 배우게 하려는 것이다. 대신 체크메이트로 끝나지 않고, 왕이 실제로 잡혀야 끝난다
     (refreshGame 의 왕 잡힘 판정). 캐슬링은 위 free() 검사가 따로 있으므로 이 규칙에서도
     체크를 통과하는 캐슬링은 여전히 안 된다. */
  return loose() ? out : out.filter(([f,t])=>!inCheck(apply(bd,f,t,g),w));
}
const ev=bd=>bd.reduce((s,p)=>p?s+(isW(p)?1:-1)*VAL[p.toLowerCase()]:s,0);
function nega(bd,g,w,d,a,b){
  /* 왕이 잡힌 국면은 그 자리에서 승부가 끝난 것으로 본다.
     이 판정이 없으면 탐색이 더 내려가서 "내가 왕을 잡고 상대도 내 왕을 잡으니 맞교환(0점)"으로
     계산해 버려, 컴퓨터가 공짜로 놓인 왕을 그냥 지나친다. (실수 허용 규칙에서만 생기는 국면이고,
     정식 규칙에서는 여기까지 오지 않으므로 손해가 없다.) */
  if(!bd.includes('K')) return w? -99999 : 99999;
  if(!bd.includes('k')) return w?  99999 : -99999;
  if(d===0) return ev(bd)*(w?1:-1);
  const list=genMoves(bd,w,g);
  if(!list.length) return inCheck(bd,w)?-99999:0;
  let best=-1e9;
  for(const [f,t] of list){
    const s=-nega(apply(bd,f,t,g),nextState(bd,f,t,g),!w,d-1,-b,-a);
    if(s>best) best=s;
    if(best>a) a=best;
    if(a>=b) break;
  }
  return best;
}
// 난이도 = 몇 수 앞을 보는가(d) + 가끔 아무 수나 두는 확률(slip).
// ponytail: 깊이 3은 중반에 3.5초가 걸려서 뺐다. 필요하면 수 정렬을 넣고 올릴 것.
const LEVELS=[{n:'쉬움 🐣',d:0,slip:.5},{n:'보통 🙂',d:1,slip:.15},{n:'어려움 😤',d:2,slip:0}];
function aiMove(bd,g){
  const L=LEVELS[st.lvl]||LEVELS[1];
  const w=g.turn==='w', list=genMoves(bd,w,g).sort(()=>Math.random()-.5);
  if(!list.length) return null;
  if(Math.random()<L.slip) return list[0];      // 섞어놨으니 무작위 한 수 = 아이가 이길 틈
  let bs=-1e9,bm=list[0];
  for(const [f,t] of list){
    const s=-nega(apply(bd,f,t,g),nextState(bd,f,t,g),!w,L.d,-1e9,1e9);
    if(s>bs){ bs=s; bm=[f,t]; }
  }
  return bm;
}

function pickStage(){
  if(forced!==null) return STAGES[forced];

const PROF={
  sphere: t=>Math.sin(Math.PI*t),
  egg:    t=>Math.pow(Math.sin(Math.PI*t),.72)*(1-.13*t),
  capsule:t=>Math.min(1,Math.sin(Math.PI*t)*2.4),
  cone:   t=>1-t*.94,
  kite:   t=>Math.min(1,Math.pow(t,.5)*1.1)*(t>.92?Math.sqrt(Math.max(0,1-((t-.92)/.08)**2)):1),
  cyl:    t=>t>.88?Math.sqrt(Math.max(0,1-((t-.88)/.12)**2)):1,
};
// 둥근 덩어리 = 원반 n장. 아래로 갈수록 어둡게 깔아 조명 없이 볼륨을 만든다.
function bl(w,h,d,c,x=0,y=0,z=0,prof='sphere'){
  const n=Math.max(4,Math.min(9,Math.round(h/4.5)));
  let s=`<div class="bl" style="--c:${c}">`;
  for(let i=0;i<n;i++){
    const t=(i+.5)/n, k=PROF[prof](t);
    if(k<.06) continue;
    const ww=w*k, dd=d*k, yy=y+h/2-t*h, a=(.36*Math.pow(1-t,1.3)).toFixed(3);
    s+=`<b style="width:${ww.toFixed(1)}px;height:${dd.toFixed(1)}px;left:${(-ww/2).toFixed(1)}px;
        top:${(-dd/2).toFixed(1)}px;box-shadow:inset 0 0 0 40px rgba(0,0,0,${a});
        transform:translate3d(${x}px,${yy.toFixed(1)}px,${z}px) rotateX(90deg)"></b>`;
  }
  return s+'</div>';
}

/* ================= 소리 (WebAudio, 파일 없음) ================= */
let ac;
const AC=()=>ac||(ac=new (window.AudioContext||window.webkitAudioContext)());
function tone(f,at,dur,type='square',vol=.12){
  const c=AC(), o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=f; o.connect(g); g.connect(c.destination);
  const t=c.currentTime+at;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.start(t); o.stop(t+dur);
}
function noise(dur=.18,vol=.25,freq=2600){
  const c=AC(), b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=c.createBufferSource(), g=c.createGain(), f=c.createBiquadFilter();
  f.type='bandpass'; f.frequency.value=freq; s.buffer=b;
  s.connect(f); f.connect(g); g.connect(c.destination); g.gain.value=vol; s.start();
}

let SQ=74;

(function buildBoard(){
  for(let i=0;i<64;i++){
    const [r,c]=RC(i), d=document.createElement('div');
    d.className='sq '+((r+c)%2?'dk':'lt');

    board.appendChild(d); sqEl.push(d);

const at=(el,i)=>{const [r,c]=RC(i);el.style.left=c*SQ+'px';el.style.top=r*SQ+'px';};
// 칸 크기 바꾸기: CSS 변수와 JS의 SQ는 항상 같아야 한다(하나만 바뀌면 칸이 어긋난다).
function setSquare(px){
  if(px===SQ) return;
  SQ=px;
  document.documentElement.style.setProperty('--sq',px+'px');
  sqEl.forEach((d,i)=>{const [r,c]=RC(i); d.style.left=c*SQ+'px'; d.style.top=r*SQ+'px';});
  if(!ex) return;
  // 전투 중이면 말을 다시 세우지 않는다 — 연출 타이머가 다 끊긴다. 자리만 옮겨두면
  // 이어지는 연출이 제 위치를 다시 잡아준다.
  if(locked) pcEl.forEach((el,i)=>el&&pos(el,...RC(i)));
  else { layout(); paint(); }
}
const pos=(el,r,c)=>el.style.transform=`translate3d(${c*SQ}px,${r*SQ}px,0)`;

// 스프라이트는 정면 그림이라 좌우 성분만큼만 살짝 틀어준다.
const face=(el,deg)=>{
  const s=el.querySelector('.spr');
  if(s) el.style.setProperty('--fy',(30*Math.sin(deg*Math.PI/180)).toFixed(1)+'deg');
  else el.querySelector('.face').style.transform=`rotateY(${deg}deg)`;

const duel=(el,left)=>{
  if(!el.querySelector('.spr')) return face(el,left?90:-90);
  el.style.setProperty('--mx',left?-1:1);
  el.style.setProperty('--fy',(left?-24:24)+'deg');

  const img=new Image();
  img.onload=()=>{ SPR=true; if(ex) layout(); };
  img.src='sprites.png';
})();
const later=(ms,fn)=>timers.push(setTimeout(fn,ms));

// 캐릭터를 직접 눌러도 그 칸을 고른 것으로 처리 (태블릿에서 말의 몸통을 짚게 된다)
const tapable=el=>el.onclick=e=>{
  e.stopPropagation(); AC().resume?.();
  const i=pcEl.indexOf(el); if(i>=0) click(i);
};
function makePiece(p,i){
  const el=document.createElement('div'); el.className='piece';
  const w=isW(p), S=CHAR[p.toUpperCase()];
  if(SPR){
    const K=p.toUpperCase(), col='KQRBNP'.indexOf(K), bp=`background-position:${col*20}% ${w?100:0}%`;
    const [cx,py]=RIG[K];                       // 팔 조각의 절단선과 어깨 축
    const rig=`--cx:${cx}%;--dx:${((cx-50)/100*72).toFixed(1)}px;--dy:${((py-100)/100*101).toFixed(1)}px`;
    el.innerHTML=`<div class="sshadow" style="${bp}"></div>
      <div class="spr body" style="${bp};${rig}"></div>
      <div class="spr arm" style="${bp};${rig}"></div>`;
    pos(el,...RC(i)); face(el,0); tapable(el); board.appendChild(el); pcEl[i]=el; return;
  }
  el.style.setProperty('--armor',w?'var(--w-armor)':'var(--b-armor)');
  el.style.setProperty('--dark', w?'var(--w-dark)' :'var(--b-dark)');
  el.style.setProperty('--trim', w?'var(--w-trim)' :'var(--b-trim)');
  el.style.setProperty('--skin', w?'var(--w-skin)' :'var(--b-skin)');
  el.style.setProperty('--cape', w?'var(--w-cape)' :'var(--b-cape)');
  el.innerHTML=`<div class="shadow"></div><div class="stand"><div class="face">
      <div class="rig"><div class="scl" style="--s:${S.s}">${S.art}</div></div></div></div>`;
  el.querySelector('.scl').style.animationDelay=(Math.random()*-2.4)+'s';
  pos(el,...RC(i)); face(el,w?14:-14);      // 평소엔 이쪽(카메라)을 보고 서 있다
  board.appendChild(el); pcEl[i]=el;
}

function layout(){                          // 새 문제: 말 전부 다시 세우기
  timers.forEach(clearTimeout); timers=[];
  pcEl=Array(64).fill(null);
  // 전투 중에 문제를 넘기면 쓰러지던 말의 제거 타이머가 취소된다 → 판에 있는 말을 전부 지운다
  board.querySelectorAll('.piece,.marker,.fx,.pop,.ball,.ring,.slash').forEach(e=>e.remove());
  ex.bd.forEach((p,i)=>p&&makePiece(p,i));
  (ex.star||[]).forEach(i=>{
    const m=document.createElement('div'); m.className='marker'; m.innerHTML='<i>★</i>';
    at(m,i); board.appendChild(m);
  });
}

// 고를 수 있는 목적지: 대국이면 정식 합법수, 퍼즐이면 기본 이동 규칙
const dests=i=> MODE==='game' ? G.legal.filter(([f])=>f===i).map(([,t])=>t)
                              : (ex.bd[i]?legal(ex.bd,i):[]);
/* 이 칸의 말을 고를 수 있는가 — 클릭 판정과 호버 미리보기가 '반드시' 같은 답을 쓰도록
   한 곳에 모아 둔다. 따로 두면 갈라져서, 반짝이지 않는 말이 선택되는 일이 생긴다.
   갈 곳이 없는 말은 고르지 않는다: 골라도 아무 일이 없으면 아이가 막힌다. */
const canPick=i=>{
  if(!ex||locked||!ex.bd[i]) return false;
  if(MODE!=='game') return isW(ex.bd[i])&&legal(ex.bd,i).length>0;
  if(G.over) return false;
  if(isW(ex.bd[i])!==(G.turn==='w')) return false;     // 상대 말
  if(G.vs==='ai'&&G.turn!=='w') return false;          // 컴퓨터 차례엔 손댈 수 없다
  return G.legal.some(([f])=>f===i);
};
// 지금 움직일 수 있는 말들의 칸 (아무것도 안 골랐을 때만 표시해서 지저분해지지 않게)
function movable(){
  if(sel!==null) return [];
  if(MODE==='game') return G.over?[]:[...new Set(G.legal.map(([f])=>f))];
  return ex.bd.map((p,i)=>p&&isW(p)&&legal(ex.bd,i).length?i:-1).filter(i=>i>=0);
}
function paint(){
  showHover(null);          // 판이 바뀌면 미리보기는 낡은 정보다 — 다음 마우스 움직임에 다시 잡힌다
  const ds=sel!==null?dests(sel):[], can=movable();
  const white=MODE!=='game'||G.turn==='w';
  document.body.classList.toggle('sel',sel!==null);
  // 흑 차례 강조색은 판의 갈색 칸과 겹치지 않는 밝은 색이어야 반짝임이 보인다
  board.style.setProperty('--turn',white?'#fff6e0':'#6fd8ff');
  sqEl.forEach((d,i)=>{
    d.classList.toggle('sel',i===sel);
    d.classList.toggle('dot',ds.includes(i));
    d.classList.toggle('can',can.includes(i));
    d.classList.toggle('warn',!!ex.warn?.includes(i));
  });
  pcEl.forEach((el,i)=>el&&el.classList.toggle('picked',i===sel));   // 고른 말만 들썩이게
}
// 입자. mode: 'down'=흘러내림, 'wind'=옆으로 날아감, 기본=사방으로 튐
function fx(i,n,sc='#ffb347',cls='fx',mode){
  const f=document.createElement('div'); f.className=cls; at(f,i);
  const D={down:  ()=>[rnd(70)-35, 24+rnd(52), 4+rnd(6)],
           wind:  ()=>[24+rnd(90), rnd(40)-28, 3+rnd(6)],
           burst: ()=>[rnd(150)-75, rnd(80)-14, 7+rnd(10)],   // 사방으로 넓게 튀며 아래로 떨어짐
           debris:()=>[rnd(180)-90, rnd(96)-20, 12+rnd(17)],  // 파편용: 더 크고 더 멀리
           def:   ()=>[rnd(110)-55, rnd(90)-72, 8+rnd(12)]};
  const g=D[mode]||D.def;
  f.innerHTML=Array.from({length:n},()=>{const [dx,dy,sz]=g();
    return `<b style="--dx:${dx}px;--dy:${dy}px;--sz:${sz}px;--sc:${sc}"></b>`;}).join('');
  board.appendChild(f); later(1250,()=>f.remove());
}
/* ===== 승리 축하 =====
   화면 가운데 폭죽을 여러 발 시차로 터뜨리고 귀여운 글씨를 띄운다.
   약 4.4초 뒤 저절로 사라지고, 화면을 누르면 바로 사라진다.
   타이머는 게임의 later() 를 쓰지 않는다 — layout() 이 게임 타이머를 전부 지우므로
   (훈련에서 다음 문제로 넘어갈 때) 축하가 중간에 끊겨 버린다. */
const FWC=['#ffd85e','#ff8a6a','#6fd8ff','#9dff7a','#e0a8ff','#fff2c8'];
function celebrate(title,sub='축하해요!'){
  $('win')?.remove();
  const el=document.createElement('div'); el.id='win';
  const chars=[...title].map((c,i)=> c===' ' ? '<span class="sp"></span>'
    : `<span style="--d:${(i*.07).toFixed(2)}s">${c}</span>`).join('');
  el.innerHTML=`<div class="wintext">${chars}</div><div class="winsub">${sub}</div>`;
  document.body.appendChild(el);

  const T=[];                                  // 이 축하가 잡은 타이머 (끌 때 전부 취소)
  const at=(ms,fn)=>T.push(setTimeout(fn,ms));
  const burst=(x,y)=>{
    const b=document.createElement('div'); b.className='fw';
    b.style.left=x+'%'; b.style.top=y+'%';
    const col=FWC[rnd(FWC.length)], n=18+rnd(10);
    b.innerHTML=Array.from({length:n},(_,i)=>
      `<b style="--a:${(360/n*i+rnd(16)).toFixed(0)}deg;--r:${70+rnd(95)}px;`+
      `--fwc:${col};--fwd:${(Math.random()*.07).toFixed(2)}s"></b>`).join('');
    el.appendChild(b); at(1500,()=>b.remove());
  };
  const close=()=>{ T.forEach(clearTimeout); el.classList.add('out');
                    setTimeout(()=>el.remove(),500); };
  el.onclick=close;

  sfx.up();
  // 가운데를 중심으로 흩뿌린다. 글씨를 가리지 않게 세로는 위·아래로 벌린다.
  [[50,30],[28,42],[72,40],[38,64],[64,66],[18,26],[82,28],[50,74]]
    .forEach(([x,y],i)=>at(120+i*300,()=>{ burst(x+rnd(9)-4,y+rnd(9)-4);
      if(i%3===0) sfx.blast(); }));
  at(4400,close);
}
function pop(i,txt){
  const p=document.createElement('div'); p.className='pop'; p.textContent=txt;
  at(p,i); p.style.top=(RC(i)[0]*SQ-12)+'px'; board.appendChild(p);
  later(1250,()=>p.remove());
}
const walk=(el,on)=>el.classList.toggle('walking',on);

/* --- 전투 연출 --- */
// 무기 끝 위치에 이펙트를 붙인다. 말 요소에 직접 붙여야 팔 조각의 clip 에 잘리지 않는다.
const anchor=(el,ax,ay,cls,extra='')=>{
  const mx=+(el.style.getPropertyValue('--mx')||1);
  const x=(ax-50)/100*72*mx, y=(ay/100-1)*101;
  const d=document.createElement('div'); d.className=cls;
  d.style.cssText=`left:calc(50% + ${x.toFixed(1)}px);top:calc(50% + ${y.toFixed(1)}px);${extra}`;
  el.appendChild(d); later(1200,()=>d.remove()); return d;
};
const shake=()=>{ const s=$('stage'); s.classList.add('shake'); later(320,()=>s.classList.remove('shake')); };
// 맞고 뒤로 밀려나기
const knock=(def,t,d)=>{
  const [tr,tc]=RC(t); def.style.transitionDuration='.16s';
  pos(def,tr-AZ,tc+AR+d);
  later(190,()=>{ pos(def,tr-AZ,tc+AR+d*.45); later(240,()=>def.style.transitionDuration=''); });
};
function slash(i,a){                            // 초승달 검광
  const d=document.createElement('div'); d.className='slash'; d.style.setProperty('--a',a+'deg');
  at(d,i); board.appendChild(d); later(420,()=>d.remove());
}
function ring(i,color){                         // 판 위에 퍼지는 충격파
  const d=document.createElement('div'); d.className='ring'; d.style.setProperty('--rc',color);
  at(d,i); board.appendChild(d); later(760,()=>d.remove());
}
function pool(i){                                // 산성 웅덩이 (판에 눕는다)
  const d=document.createElement('div'); d.className='pool'; d.innerHTML='<i></i>';
  at(d,i); board.appendChild(d); later(2050,()=>d.remove());   // poolOut(1.9s)보다 늦게 치운다
}
// 방어자를 감싸는 전기 다발. 방어자는 칸 오른쪽(AR)에 비켜서 있으니 그 자리에 맞춘다.
function zap(i,n){
  const [r,c]=RC(i), d=document.createElement('div'); d.className='zap';
  d.innerHTML=Array.from({length:n},()=>
    `<b style="--zr:${rnd(70)-35}deg;--zx:${rnd(34)-17}px;--zy:${rnd(44)-22}px;`+
    `--zh:${44+rnd(46)}px;--zw:${5+rnd(5)}px;`+
    `--zd:${(.32+Math.random()*.3).toFixed(2)}s;--zt:${(Math.random()*.16).toFixed(2)}s"></b>`).join('');
  pos(d,r-AZ,c+AR); board.appendChild(d); later(950,()=>d.remove());
}
/* 룩 대포에 맞으면 캐릭터 그림이 조각나서 흩어진다.
   스프라이트를 부채꼴로 잘라낸 복제본 8개를 만들어 각자 다른 방향으로 회전시켜 날린다.
   복제본은 원본의 background-position 을 그대로 물려받으므로 같은 캐릭터 그림이 된다. */
const WEDGE=[[[50,50],[0,0],[50,0]],   [[50,50],[50,0],[100,0]],
             [[50,50],[100,0],[100,50]],[[50,50],[100,50],[100,100]],
             [[50,50],[100,100],[50,100]],[[50,50],[50,100],[0,100]],
             [[50,50],[0,100],[0,50]],  [[50,50],[0,50],[0,0]]];
const WDIR=[[-42,-54],[42,-54],[66,-26],[66,26],[42,54],[-42,54],[-66,26],[-66,-26]];
function shatterPieces(def){
  const src=def.querySelector('.body'); if(!src) return;
  WEDGE.forEach((w,i)=>{
    const p=src.cloneNode(false);              // 자식 없이 복제 — style(background-position)은 따라온다
    p.className='spr chunk';                   // .body 의 몸통/팔 분할과 폭발 애니메이션을 떼어낸다
    const k=.8+Math.random()*.7, [dx,dy]=WDIR[i];
    p.style.clipPath='polygon('+w.map(([x,y])=>x+'% '+y+'%').join(',')+')';
    p.style.setProperty('--fx',(dx*k).toFixed(0)+'px');
    p.style.setProperty('--fy',(dy*k).toFixed(0)+'px');
    p.style.setProperty('--fr',(rnd(500)-250)+'deg');
    def.appendChild(p);
  });
}
function fly(fr,fc,tr,tc,ms,style,cls=''){       // 3D 포물선으로 날아가는 탄
  const d=document.createElement('div'); d.className='ball'+(cls?' '+cls:'');
  d.style.setProperty('--fly',ms+'ms'); d.style.cssText+=style;
  d.innerHTML='<i></i>'; pos(d,fr,fc); board.appendChild(d);
  d.getBoundingClientRect();                    // 시작 위치를 확정시킨 뒤 이동
  pos(d,tr,tc);
  later(ms+80,()=>d.remove());
}
// 결투 배치: 같은 칸 안에서 공격자는 왼쪽, 방어자는 오른쪽으로 갈라서서 마주본다
const AL=-.30, AR=.24, AZ=.07;
const engage=(atk,def,t)=>{
  const [tr,tc]=RC(t);
  duel(def,false); pos(def,tr-AZ,tc+AR);        // 방어자: 오른쪽으로 비켜서며 왼쪽을 본다
  duel(atk,true);  walk(atk,true); sfx.step();
  pos(atk,tr+AZ,tc+AL);                         // 공격자: 방어자 칸 왼쪽으로 진입
  later(230,sfx.step);
  later(600,()=>walk(atk,false));
};
// 방어자는 반격하지 않는다 — 뒷걸음질치며 방패를 들어 웅크린다
const counter=(atk,def,t,t0)=>{
  const [tr,tc]=RC(t);
  later(t0,()=>{ def.classList.add('brace'); sfx.clash();
                 def.style.transitionDuration='.18s'; pos(def,tr-AZ,tc+AR+.1); });
  later(t0+430,()=>{ def.classList.remove('brace');
                     pos(def,tr-AZ,tc+AR); later(200,()=>def.style.transitionDuration=''); });
};
const sand=(i,n)=>fx(i,n,'#cdb491','fx slow','wind');       // 바람에 날리는 모래
/* ===== 죽는 방식은 '누가 죽였는가'로 갈린다 =====
   gone = 죽기 시작한 순간부터 시체가 사라지기까지의 ms.
   CSS의 .dying.d-종류{--dd} 와 반드시 같은 값이어야 한다 — 어긋나면 시체가 남거나 중간에 잘린다. */
const DEATH={
  // 폰·기본: 석화 → 모래 → 바람
  sand:{gone:1500,snd:()=>sfx.fall(),fx:(t,t0)=>{
    later(t0+480,()=>{ sfx.sand(); fx(t,10,'#b9ab93','fx slow','down'); });
    later(t0+760,()=>sand(t,16)); later(t0+1000,()=>sand(t,14)); later(t0+1240,()=>sand(t,10)); }},
  // 비숍 감전: 지지직거리며 검게 타서 재가 된다
  burn:{gone:1250,snd:()=>sfx.zap(),fx:(t,t0,def)=>{
    later(t0,()=>{ zap(t,6); fx(t,8,'#dff2ff'); });
    later(t0+180,()=>{ sfx.zap(); zap(t,4); });
    later(t0+420,()=>fx(t,9,'#ff9d3c','fx slow'));            // 타는 불티
    later(t0+700,()=>fx(t,10,'#5b5b5b','fx slow','wind'));    // 검은 재·연기
    later(t0+980,()=>fx(t,8,'#3a3a3a','fx slow','wind')); }},
  // 퀸 산성: 온몸이 초록으로 변해 녹아 바닥 웅덩이가 된다
  melt:{gone:1600,snd:()=>sfx.sand(),fx:(t,t0)=>{
    later(t0+240,()=>pool(t));                                // 초록으로 변한 뒤에 웅덩이가 번진다
    [260,520,780,1040,1300].forEach(d=>later(t0+d,()=>fx(t,7,'#7dff9b','fx slow','down'))); }},
  // 룩 대포: 섬광과 함께 그림이 조각나서 펑 (조각은 shatterPieces 가 만든다)
  shatter:{gone:1000,snd:()=>sfx.blast(),fx:(t,t0,def)=>{
    later(t0,()=>{ shatterPieces(def); fx(t,10,'#ffffff');
                   fx(t,18,'#cdd6df','fx frag','debris'); ring(t,'#ffd9a0'); shake(); });
    later(t0+240,()=>fx(t,12,'#8d959b','fx slow','debris')); }},
  // 나이트 내리찍기: 납작하게 짜부러진다
  squash:{gone:1100,snd:()=>sfx.thud(),fx:(t,t0)=>{
    later(t0,()=>{ ring(t,'#ffd08a'); fx(t,14,'#d9c7a6','fx','burst'); shake(); });
    later(t0+300,()=>fx(t,8,'#b9ab93','fx slow','down')); }},
  // 킹이 던진 칼: 칼이 박히고 뒤로 넘어간다
  blade:{gone:1300,snd:()=>sfx.fall(),fx:(t,t0,def)=>{
    later(t0,()=>{ anchor(def,50,52,'stuck'); fx(t,8,'#dfe8ff'); });
    later(t0+520,()=>fx(t,8,'#b9ab93','fx slow','down')); }},
};
// 죽는 방식(공격자별)과 공격자 마무리(공통: 걸어 들어가 승리 포즈)를 합쳐 총 대기시간을 준다
const finish=(atk,def,t,t0,kind='sand')=>{
  const D=DEATH[kind]||DEATH.sand;
  later(t0,()=>{ def.classList.remove('hit'); def.classList.add('dying','d-'+kind); D.snd(); });
  D.fx(t,t0,def);
  const enter=t0+Math.max(280,D.gone-600), gone=t0+D.gone;
  later(enter,()=>{ walk(atk,true); pos(atk,...RC(t)); sfx.step(); });
  later(gone,()=>{ def.remove(); walk(atk,false); unduel(atk); atk.classList.add('cheer'); });
  later(gone+600,()=>atk.classList.remove('cheer'));
  return gone+700;
};
const smash=(def,t,t0,n=14,c='#ff8a3c',kb=.17)=>
  later(t0,()=>{ def.classList.add('hit'); sfx.hit(); fx(t,n,c); shake(); knock(def,t,kb); });
// 근접 공격자가 앞으로 파고들었다 돌아온다
const lunge=(atk,t,d=.12)=>{
  const [tr,tc]=RC(t); atk.style.transitionDuration='.13s';
  pos(atk,tr+AZ,tc+AL+d);
  later(220,()=>{ pos(atk,tr+AZ,tc+AL); later(260,()=>atk.style.transitionDuration=''); });
};

// 말마다 다른 공격. 근접(나이트·킹·폰)은 다가가서 치고, 원거리(룩·퀸·비숍)는 제자리에서 쏜다.
// 원거리 공격은 코앞에서 쏜다: 공격자(왼쪽) → 방어자(오른쪽)로 짧은 포물선
const shot=(t,ms,style,cls)=>{ const [tr,tc]=RC(t); fly(tr+AZ,tc+AL,tr-AZ,tc+AR,ms,style,cls); };

const ATTACK={
  N:(atk,def,t)=>{                              // 나이트: 높이 도약해 쾅 내리찍는다 → 짜부러짐
    counter(atk,def,t,620);
    later(1000,()=>{ atk.classList.add('jump'); sfx.step(); });     // 도약
    later(1190,()=>lunge(atk,t,.15));                               // 공중에서 앞으로 파고든다
    later(1440,()=>{ slash(t,62); sfx.slash(); });                  // 내리찍는 궤적
    later(1500,()=>{ sfx.thud(); ring(t,'#ffd08a');

function battle(f,t){
  const atk=pcEl[f], def=pcEl[t], type=(ex.bd[t]||'N').toUpperCase();   // 이동 반영 후라 t 칸이 공격자
  pcEl[f]=null; pcEl[t]=atk;
  engage(atk,def,t);                            // 한 칸 안에서 좌·우로 갈라서서 마주본다
  return (ATTACK[type]||ATTACK.N)(atk,def,t);
}
function glide(f,t){
  const [tr,tc]=RC(t), el=pcEl[f];
  pcEl[f]=null; pcEl[t]=el;
  face(el,toward(f,t)); walk(el,true); sfx.step(); pos(el,tr,tc);
  later(260,sfx.step);
  later(600,()=>{ walk(el,false); face(el,SPR?0:(isW(ex.bd[t])?14:-14)); });
  return 1000;
}

function panel(){
  $('stars').textContent=st.stars; $('streak').textContent=st.streak;
  const ok=STAGES.reduce((a,x)=>a+st.s[x.id].ok,0), no=STAGES.reduce((a,x)=>a+st.s[x.id].no,0);
  $('acc').textContent=ok+no?Math.round(ok*100/(ok+no))+'%':'-';
  const n=unlocked();
  $('stages').innerHTML=STAGES.map((x,i)=>
    `<button class="btn ghost row-btn${i<n?'':' locked'}${x.id===ex?.id?' now':''}"
       onclick="jump(${i})"><span>${x.name}</span>
       <span class="badge">${i<n?'⭐ '+st.s[x.id].ok:'🔒'}</span></button>`).join('');
  $('mode').textContent=forced===null?'약한 단계를 더 자주 냅니다'
                                     :STAGES[forced].name+'만 반복 중';
}
function jump(i){ forced=i; next(); }         // 잠긴 단계도 눌러서 바로 연습 가능

function next(){
  let s; ex=null;                               // 메이트 문제는 무작위 배치 중 0.85%만 성립 → 넉넉히 시도
  for(let round=0;round<12&&!ex;round++){ s=pickStage(); for(let t=0;t<4000&&!(ex=s.gen());t++); }
  if(!ex){ forced=null; s=STAGES[0]; while(!(ex=s.gen())); }
  ex.id=s.id; sel=ex.sel??null; wrongs=0; locked=false;
  $('goal').innerHTML=ex.text+`<small>${ex.sub}</small>`;
  $('msg').textContent='';
  layout(); paint(); panel();
}

function click(i){
  if(locked) return;
  if(MODE==='game'){
    const me=G.turn==='w';
    if(G.over||(G.vs==='ai'&&!me)) return;       // 컴퓨터 차례엔 손대지 않는다
    if(sel!==null&&dests(sel).includes(i)) return doMove(sel,i);
    sel=canPick(i)?i:null; paint(); return;
  }
  if(sel!==null&&ex.bd[sel]&&legal(ex.bd,sel).includes(i)) return tryMove(sel,i);
  if(canPick(i)){ sel=i; paint(); }
}
function flash(i,cls){
  sqEl[i].classList.add(cls); later(450,()=>sqEl[i].classList.remove(cls));
}

function tryMove(f,t){
  // 전적은 정식 단계(STAGES)에만 기록한다. 연출 시험 판처럼 단계가 아닌 판도 있다.
  const rec=st.s[ex.id];
  if(ex.ans.has(f+'-'+t)){
    st.stars++; st.streak++; st.best=Math.max(st.best,st.streak); if(rec) rec.ok++;
    saveSt(); locked=true;
    const before=unlocked(), fight=!!ex.bd[t], mateSq=ex.mate;
    ex.bd=play(ex.bd,f,t); ex.star=ex.warn=null; sel=null;
    board.querySelectorAll('.marker').forEach(e=>e.remove());
    paint(); flash(t,'good');
    let wait=fight?battle(f,t):glide(f,t);
    if(mateSq&&pcEl[mateSq]){                       // 체크메이트: 적 왕이 무릎을 꿇는다
      later(700,()=>{ pcEl[mateSq].classList.add('dying'); sfx.fall(); pop(mateSq,'체크메이트!'); });
      wait=Math.max(wait,2200);
    }
    later(fight?2600:300,()=>{ sfx.good(); pop(t,'⭐ +1'); });
    $('msg').innerHTML='⭐ 잘했어요!<br><small>'+(ex.tip||'')+'</small>';
    panel();
    if(unlocked()>before){ $('msg').innerHTML='🎉 새 단계 열림!<br>'+STAGES[before].name;
      later(900,()=>celebrate('새 단계!',STAGES[before].name+' 열렸어요')); }
    later(wait,next);
  }else{
    st.streak=0; if(rec) rec.no++; saveSt(); wrongs++; sfx.bad();
    flash(t,'bad'); panel();
    $('msg').textContent=wrongs>=2?'괜찮아요, 힌트를 볼까요? 💡':'음… 다시 한 번!';
    if(wrongs>=2) showHint();
  }
}

             {v:false,n:'정식 규칙 ♟️',

const flipBoard=()=>document.documentElement.style.setProperty('--flip',

function setMode(m){

    b.setAttribute('data-state',b.dataset.m===m?'active':'inactive'));

  else { st.vs=m==='solo'?'ai':'human'; newGame(); }

function newGame(){
  MODE='game'; drawLvls(); drawRule(); $('win')?.remove();   // 축하가 떠 있으면 걷어낸다
  G={turn:'w',castle:'KQkq',ep:-1,hist:[],over:false,vs:st.vs};
  ex={bd:fromFen(START),warn:null,star:null};
  sel=null; locked=false;
  refreshGame(); layout(); paint();
}
function refreshGame(){
  const duo0=G.vs==='human';
  // 이미 끝난 판에서 다시 불려도(예: 규칙 스위치) 축하가 두 번 터지지 않게 한다
  const wasOver=G.over;
  /* 실수 허용 규칙에서는 체크메이트가 아니라 '왕이 실제로 잡히는 것'으로 끝난다.
     정식 규칙에서는 여기까지 올 수 없다(왕이 잡히는 수가 애초에 걸러지므로). */
  if(!ex.bd.includes('K')||!ex.bd.includes('k')){
    const whiteWon=!ex.bd.includes('k');
    G.over=true; G.legal=[]; sel=null;
    $('goal').innerHTML=duo0
      ? `${whiteWon?'흰 말':'검은 말'} 승리! 왕을 잡았어요 👑<small>축하해요</small>`
      : (whiteWon?'이겼어요! 왕을 잡았어요 🎉<small>정말 잘했어요</small>'
                 :'졌어요… 왕이 잡혔어요 😢<small>왕이 위험한 칸에 서 있었어요</small>');
    $('msg').innerHTML='왕이 잡혀서 끝났어요<br><small>↩️ 무르기로 되돌릴 수 있어요</small>';
    // 둘이서는 이긴 쪽을, 혼자는 사람(백)이 이겼을 때만 축하한다
    if(!wasOver){
      if(duo0) celebrate(`${whiteWon?'흰 말':'검은 말'} 승리!`,'왕을 잡았어요 👑');
      else if(whiteWon) celebrate('이겼다!','왕을 잡았어요 👑');
    }
    return;
  }
  G.legal=genMoves(ex.bd,G.turn==='w',G);
  const chk=inCheck(ex.bd,G.turn==='w'), me=G.turn==='w', duo=G.vs==='human';
  if(!G.legal.length){
    G.over=true;
    $('goal').innerHTML=chk
      ? (duo?`${me?'검은 말':'흰 말'} 승리! 체크메이트 🎉<small>축하해요</small>`
            :(me?'졌어요… 체크메이트 😢<small>다시 도전!</small>'
                :'이겼어요! 체크메이트 🎉<small>정말 잘했어요</small>'))
      : '무승부예요 (스테일메이트)<small>움직일 수 있는 말이 없어요</small>';
    // 체크메이트를 당한 쪽은 '지금 둘 차례'인 쪽이므로, 이긴 쪽은 그 반대다
    if(chk&&!wasOver){
      const winW=!me;
      if(duo) celebrate(`${winW?'흰 말':'검은 말'} 승리!`,'체크메이트!');
      else if(winW) celebrate('이겼다!','체크메이트!');
    }
  }else{
    const chip=`<span class="turn ${me?'w':'b'}"><i></i>${me?'흰 말':'검은 말'} 차례</span>`;
    $('goal').innerHTML=(duo||me?chip:`${chip} 상대가 생각 중… 🤔`)+
      (chk?' <b style="color:#ff7a6a">체크!</b>':'')+
      `<small>빛나는 말이 지금 움직일 수 있는 말이에요</small>`;
  }
  $('msg').innerHTML=`백 ${ev(ex.bd)>0?'+'+Math.round(ev(ex.bd)/100):Math.round(ev(ex.bd)/100)} <small>기물 점수</small>`;
}
function doMove(f,t){
  G.hist.push({bd:ex.bd.slice(),g:{turn:G.turn,castle:G.castle,ep:G.ep}});
  const p=ex.bd[f], cap=!!ex.bd[t]||(p.toLowerCase()==='p'&&t===G.ep);
  const ng=nextState(ex.bd,f,t,G);
  ex.bd=apply(ex.bd,f,t,G);
  Object.assign(G,ng); sel=null; locked=true; paint();
  const wait=cap?battle(f,t):glide(f,t);
  later(wait,()=>{
    layout();                                  // 캐슬링·승진·앙파상은 그림을 다시 깐다
    refreshGame(); locked=false; paint();
    if(!G.over&&G.vs==='ai'&&G.turn==='b') later(500,aiTurn);
  });
}
function aiTurn(){
  const mv=aiMove(ex.bd,G);
  if(!mv){ refreshGame(); return; }
  locked=true;
  const [f,t]=mv, p=ex.bd[f], cap=!!ex.bd[t]||(p.toLowerCase()==='p'&&t===G.ep);
  G.hist.push({bd:ex.bd.slice(),g:{turn:G.turn,castle:G.castle,ep:G.ep}});
  const ng=nextState(ex.bd,f,t,G);
  ex.bd=apply(ex.bd,f,t,G); Object.assign(G,ng);
  const wait=cap?battle(f,t):glide(f,t);
  later(wait,()=>{ layout(); refreshGame(); locked=false; paint(); });
}
function undoMove(){        // 컴퓨터와 둘 땐 두 수(내 수+상대 수), 둘이서면 한 수만 되돌린다
  if(MODE!=='game'||!G.hist.length) return;
  timers.forEach(clearTimeout); timers=[];
  for(let n=0,k=G.vs==='ai'?2:1;n<k&&G.hist.length;n++){
    const h=G.hist.pop(); ex.bd=h.bd; Object.assign(G,h.g);
  }
  G.over=false; sel=null; locked=false;
  refreshGame(); layout(); paint();
}

function showHint(){
  if(!ex?.ans?.size) return;         // 정답이 없는 판(연출 시험)에서는 힌트가 없다
  const first=[...ex.ans][0];
  sel=+first.split('-')[0]; paint();
  const goals=[...ex.ans].map(s=>+s.split('-')[1]);
  goals.forEach(g=>sqEl[g].classList.add('hint'));
  later(1800,()=>goals.forEach(g=>sqEl[g].classList.remove('hint')));
}

/* ===== 마우스를 가져가면 '지금 누르면 골라질 말'을 미리 반짝여 준다 =====
   캐릭터 그림은 서 있어서 뒤쪽 칸을 덮는다. 그래서 누르기 전에는 어느 말이
   골라질지 알기 어려웠다. 여기서는 브라우저가 클릭에 실제로 쓰는 히트테스트
   (elementFromPoint)를 그대로 써서 판정하므로, 미리보기와 클릭 결과가 어긋날 수 없다.
   고를 수 없는 말은 반짝이지 않는다 — 미리보기가 거짓말을 하면 안 되니까. */
// 미리보기는 클릭과 같은 canPick을 쓴다. 이미 말을 고른 뒤엔 미리보기를 끈다
// (그때는 목적지를 고르는 중이고, body.sel 규칙이 클릭을 칸으로 넘긴다).
const previewable=i=> sel===null && canPick(i);
let hovI=null;
function showHover(i){
  if(i===hovI) return;
  if(hovI!==null){ pcEl[hovI]?.classList.remove('hov'); sqEl[hovI]?.classList.remove('hov'); }
  hovI=i;
  if(i!==null){ pcEl[i]?.classList.add('hov'); sqEl[i]?.classList.add('hov'); }
}
function hoverAt(x,y){
  const el=document.elementFromPoint(x,y);
  let i=-1;
  if(el){
    const pc=el.closest?.('.piece');
    if(pc) i=pcEl.indexOf(pc);                            // 캐릭터 몸통 위
    else if(el.classList.contains('sq')) i=sqEl.indexOf(el);   // 빈 바닥 칸 위
  }
  showHover(i>=0&&previewable(i)?i:null);
}
let hovRaf=0;
addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse') return;      // 손가락엔 호버가 없다 — 대는 순간이 곧 클릭
  if(hovRaf) return;                       // 프레임당 한 번만 판정
  const x=e.clientX, y=e.clientY;
  hovRaf=requestAnimationFrame(()=>{ hovRaf=0; hoverAt(x,y); });
});
document.addEventListener('mouseleave',()=>showHover(null));

/* 메뉴판 끌어서 옮기기 (터치·마우스 공용). 놓은 자리는 기억한다. */
let putPanel=null;                       // 접었다 펼 때 놓아둔 자리를 되돌리기 위해 밖으로 뺀다
(function movePanel(){
  const P=$('panel'), H=$('grab');
  const put=(x,y)=>{
    const w=P.offsetWidth,h=P.offsetHeight;
    x=Math.max(4,Math.min(innerWidth-w-4,x)); y=Math.max(4,Math.min(innerHeight-h-4,y));
    P.classList.add('moved'); P.style.left=x+'px'; P.style.top=y+'px';
    st.panel=[x,y]; saveSt();
  };
  putPanel=put;
  // 접힌 채로 시작하면 우측 상단 고정 자리를 써야 하니 놓아둔 자리를 복원하지 않는다
  if(st.panel&&!st.min) later(60,()=>put(st.panel[0],st.panel[1]));
  let dx=0,dy=0,on=false;
  H.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;        // 탭 버튼 누른 건 이동이 아니다
    const r=P.getBoundingClientRect(); dx=e.clientX-r.left; dy=e.clientY-r.top; on=true;
    H.setPointerCapture(e.pointerId); e.preventDefault();
  });
  H.addEventListener('pointermove',e=>{ if(on) put(e.clientX-dx,e.clientY-dy); });
  H.addEventListener('pointerup',()=>{on=false});
  H.addEventListener('dblclick',()=>{ P.classList.remove('moved'); P.style.left=P.style.top='';
    st.panel=null; saveSt(); });                 // 두 번 누르면 제자리로
})();

/* 판 영역은 원근 확산까지 포함해 8칸*1.3 폭.
   손잡이가 둘로 나뉜다:
     --sq  = 남는 공간을 쓰는 손잡이. 그림은 고정 px이라 칸이 커지면 겹침이 줄어든다.
     --zoom= 화면이 너무 좁아 최소 칸(74px)조차 못 넣을 때만 쓰는 비상구. 전체를 줄인다.
   zoom으로만 맞추면 그림까지 같이 커지고 작아져서 겹침 비율이 그대로다 — 그래서 나눴다. */
function fit(){
  // 접힌 패널은 position:fixed로 흐름에서 빠지므로 가로를 전혀 예약하지 않는다.
  // 펼친 패널은 흐름에 있으니 실측 폭 + 여백(gap 20 + body padding 28 + 여유 18)을 뺀다.
  const wide=innerWidth>560, mini=$('panel').classList.contains('min');
  const availW=innerWidth-(wide&&!mini?$('panel').offsetWidth+66:24);
  const root=document.documentElement, brd=$('board'), stg=$('stage');
  // 판의 투영 높이는 칸 크기에 비례하지 '않는다' — perspective가 고정 px이라
  // 칸이 커질수록 앞줄이 훨씬 크게 확대된다(칸 1.6배에 투영 1.95배).
  // 그래서 공식으로 계산하지 않고, 칸을 줄여가며 실제 투영이 화면에 들어오는지 재본다.
  // 재는 동안은 --sq만 건드린다(칸 위치·말은 그대로) — #board 박스 크기만 보면 되니까.
  root.style.setProperty('--zoom',1);
  let s=Math.max(SQ_MIN,Math.min(SQ_MAX,Math.floor(availW/10.4)));
  for(;;s-=4){
    root.style.setProperty('--sq',s+'px');
    const b=brd.getBoundingClientRect();
    if(s<=SQ_MIN||(b.bottom<=innerHeight-8&&b.top>=0)) break;
  }
  s=Math.max(SQ_MIN,s); root.style.setProperty('--sq',s+'px');
  // 최소 칸으로도 안 들어가면 전체를 줄이는 비상구. zoom은 흐름상 위쪽(#goal)을
  // 밀지 않으므로 무대 top을 기준으로 남은 높이 비율을 쓴다.
  const b=brd.getBoundingClientRect(), top=stg.getBoundingClientRect().top;
  root.style.setProperty('--zoom',
    Math.min(1, availW/(s*10.4), (innerHeight-8-top)/(b.bottom-top)).toFixed(3));
  setSquare(s);
}
/* 메뉴판 접기/펴기.
   접으면 ① 패널이 흐름에서 빠져 우측 상단에 뜨고(가로가 판으로),
          ② 판 위 큰 안내문을 바 안으로 옮겨 담는다(세로가 판으로).
   안내문은 새로 그리지 않고 같은 #goal 원소를 옮기기만 한다 —
   refreshGame·next가 계속 #goal에 쓰므로 표시가 어긋날 수가 없다. */
function toggleMin(){
  const p=$('panel'), on=!p.classList.contains('min'), goal=$('goal');
  p.classList.toggle('min',on);
  if(on){
    $('grab').appendChild(goal);           // 헤더 안에 넣어 바를 끌 때 같이 잡히게
    p.classList.remove('moved');           // 우측 상단 고정 자리를 쓴다
    p.style.left=p.style.top='';
  }else{
    document.body.insertBefore(goal,$('stage'));
    if(st.panel) putPanel(st.panel[0],st.panel[1]);   // 펼치면 놓아뒀던 자리로 되돌린다
  }
  $('minbtn').textContent=on?'+':'−';
  $('minbtn').setAttribute('aria-label',on?'메뉴판 펼치기':'메뉴판 접기');
  st.min=on; saveSt(); fit();
}
if(st.min) toggleMin();                    // 지난번에 접어뒀으면 접힌 채로 시작
addEventListener('resize',fit); fit();

/* Flat battle regression harness (?test). */
window.__battleTest={
  results:[],
  assert(name,condition,detail=''){
    const result={name,pass:Boolean(condition),detail};
    this.results.push(result);
    const log=result.pass?console.info:console.error;
    log.call(console,`[battle-test] ${result.pass?'PASS':'FAIL'}: ${name}`,detail);
    return result.pass;
  },
  report(){
    const passed=this.results.filter(x=>x.pass).length;
    const report={passed,failed:this.results.length-passed,total:this.results.length,
      results:this.results.slice()};
    console.table(this.results);
    return report;
  }
};

window.measureInputLatency=function measureInputLatency(action){
  const started=performance.now();
  return new Promise((resolve,reject)=>{
    requestAnimationFrame(()=>{
      try{
        action();
        resolve(performance.now()-started);
      }catch(error){ reject(error); }
    });
  });
};

async function ordinaryMoveAcceptsNextFrame(){
  const frame=document.createElement('iframe');
  const saved=localStorage.getItem(KEY);
  frame.hidden=true;
  frame.src=location.pathname;
  document.body.appendChild(frame);
  try{
    await new Promise((resolve,reject)=>{
      frame.onload=resolve;
      frame.onerror=()=>reject(new Error('test frame failed to load'));
    });
    const w=frame.contentWindow, d=frame.contentDocument;
    w.setMode('duo');
    w.doMove(52,44);
    const latency=await measureInputLatency(()=>w.click(8));
    return {accepted:Boolean(d.querySelectorAll('.sq')[8]?.classList.contains('sel')),latency};
  }finally{
    frame.remove();
    if(saved===null) localStorage.removeItem(KEY);
    else localStorage.setItem(KEY,saved);
  }
}

async function runFlatBattleRegression(){
  const test=window.__battleTest;
  test.results.length=0;
  const stageStyle=getComputedStyle($('stage'));
  const boardTransform=getComputedStyle(board).transform;
  let boardIs2D=false;
  try{ boardIs2D=boardTransform==='none'||new DOMMatrixReadOnly(boardTransform).is2D; }
  catch(_){ boardIs2D=false; }
  const camera=getComputedStyle(document.documentElement).getPropertyValue('--cam').trim();

  test.assert('board stage has no perspective',
    stageStyle.perspective==='none',
    `perspective=${stageStyle.perspective}`);
  test.assert('board transform contains no 3D matrix',
    boardIs2D&&!/matrix3d/i.test(boardTransform),
    `transform=${boardTransform}`);
  test.assert('camera compensation is identity',
    camera===''||camera==='none'||/^rotate(?:Z)?\(0deg\)$/.test(camera),
    `--cam=${camera||'(empty)'}`);
  const ordinary=await ordinaryMoveAcceptsNextFrame();
  test.assert('ordinary move unlocks by the next animation frame',
    ordinary.accepted,
    `accepted=${ordinary.accepted}, latency=${ordinary.latency.toFixed(1)}ms`);
  return test.report();
}

if(new URLSearchParams(location.search).has('test')){
  requestAnimationFrame(async()=>{
    try{ window.__battleTest.initial=await runFlatBattleRegression(); }
    catch(error){
      window.__battleTest.assert('regression harness completed',false,error.message);
      window.__battleTest.initial=window.__battleTest.report();
    }
  });
}

/* ===== 연출 시험: 주소 끝에 ?fx 를 붙이면 아래에 버튼 막대가 생긴다 =====
   6가지 공격·죽음을 실제 대국을 기다리지 않고 바로 돌려본다. 평상시 플레이엔 영향이 없다.
   tryMove 와 같은 순서를 지킨다: layout()으로 이동 전 배치를 세우고 → ex.bd 에 이동을
   반영하고 → battle(f,t). battle 은 t 칸에 공격자가 있다고 전제한다. */
let fxLast='N';
function fxPlay(k){
  fxLast=k||fxLast;
  MODE='puzzle'; forced=null;
  const f=ID(4,3), t=ID(3,3);
  ex={id:'fxlab',bd:Array(64).fill(''),ans:new Set(),warn:null,star:null};
  ex.bd[f]=fxLast; ex.bd[t]='p';                       // 공격자(백) → 바로 앞의 흑 폰
  sel=null; locked=true;
  layout(); paint();
  $('goal').innerHTML=`연출 시험 — ${NAME[fxLast]}<small>아래 버튼으로 다른 연출을 봅니다</small>`;
  ex.bd=play(ex.bd,f,t);
  battle(f,t);
  // locked 을 풀지 않는다: 시험 판은 정답이 없어서 판을 누르면 채점 경로로 들어간다.
  // 위 탭(훈련·혼자·둘이서)을 누르면 setMode 가 정상 상태로 되돌린다.
}

  bar.innerHTML='<b>연출 시험</b>'+['B','Q','R','N','K','P']
    .map(k=>`<button onclick="fxPlay('${k}')">${NAME[k]}</button>`).join('')+
    '<button onclick="fxPlay()">다시</button>';
  document.body.appendChild(bar);
}
