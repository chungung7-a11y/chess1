<!doctype html>
<meta charset="utf-8">
<title>테트리스</title>
<style>
  body { background:#111; color:#eee; font:14px monospace; display:flex; gap:20px;
         justify-content:center; align-items:flex-start; padding:20px; }
  canvas { background:#000; border:1px solid #444; }
  #info { line-height:1.8 }
</style>
<canvas id="c" width="300" height="600"></canvas>
<div id="info">
  점수 <b id="score">0</b><br>
  줄 <b id="lines">0</b><br>
  레벨 <b id="level">1</b><br>
  <span id="msg"></span>
  <hr>← → 이동<br>↓ 소프트드롭<br>↑ 회전<br>space 하드드롭<br>p 일시정지
</div>
<script>
const COLS = 10, ROWS = 20, S = 30;
const SHAPES = {
  I: [[1,1,1,1]],
  O: [[1,1],[1,1]],
  T: [[0,1,0],[1,1,1]],
  S: [[0,1,1],[1,1,0]],
  Z: [[1,1,0],[0,1,1]],
  J: [[1,0,0],[1,1,1]],
  L: [[0,0,1],[1,1,1]],
};
const COLORS = {I:'#3dd',O:'#dd3',T:'#a4d',S:'#3d3',Z:'#d33',J:'#46d',L:'#d83'};
const ctx = document.getElementById('c').getContext('2d');

let grid, piece, score, lines, level, over, paused, dropAcc, last;

const rotate = m => m[0].map((_, i) => m.map(r => r[i]).reverse());

function spawn() {
  const k = Object.keys(SHAPES)[Math.random() * 7 | 0];
  const m = SHAPES[k];
  return { m, color: COLORS[k], x: (COLS - m[0].length) >> 1, y: 0 };
}

function collide(p) {
  return p.m.some((row, dy) => row.some((v, dx) => {
    if (!v) return false;
    const x = p.x + dx, y = p.y + dy;
    return x < 0 || x >= COLS || y >= ROWS || (y >= 0 && grid[y][x]);
  }));
}

function merge(p) {
  p.m.forEach((row, dy) => row.forEach((v, dx) => {
    if (v) grid[p.y + dy][p.x + dx] = p.color;
  }));
}

function clearLines() {
  const kept = grid.filter(row => row.some(c => !c));
  const n = ROWS - kept.length;
  while (kept.length < ROWS) kept.unshift(Array(COLS).fill(0));
  grid = kept;
  return n;
}

function lock() {
  merge(piece);
  const n = clearLines();
  if (n) {
    lines += n;
    score += [0, 100, 300, 500, 800][n] * level;
    level = (lines / 10 | 0) + 1;
  }
  piece = spawn();
  if (collide(piece)) { over = true; msg.textContent = '게임 오버 — R 키로 재시작'; }
  score_.textContent = score; lines_.textContent = lines; level_.textContent = level;
}

function move(dx, dy) {
  piece.x += dx; piece.y += dy;
  if (!collide(piece)) return true;
  piece.x -= dx; piece.y -= dy;
  if (dy > 0) lock();
  return false;
}

function draw() {
  ctx.clearRect(0, 0, COLS * S, ROWS * S);
  const cell = (x, y, c) => {
    ctx.fillStyle = c; ctx.fillRect(x * S, y * S, S - 1, S - 1);
  };
  grid.forEach((row, y) => row.forEach((c, x) => c && cell(x, y, c)));
  piece.m.forEach((row, dy) => row.forEach((v, dx) =>
    v && cell(piece.x + dx, piece.y + dy, piece.color)));
}

function loop(t) {
  const dt = t - (last || t); last = t;
  if (!over && !paused) {
    dropAcc += dt;
    // ponytail: 단순 선형 속도. 정식 낙하 테이블 필요하면 그때 표로 교체.
    if (dropAcc > Math.max(80, 800 - (level - 1) * 70)) { dropAcc = 0; move(0, 1); }
    draw();
  }
  requestAnimationFrame(loop);
}

function reset() {
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  piece = spawn();
  score = lines = 0; level = 1; over = paused = false; dropAcc = 0;
  msg.textContent = '';
  score_.textContent = lines_.textContent = 0; level_.textContent = 1;
}

const [score_, lines_, level_, msg] =
  ['score', 'lines', 'level', 'msg'].map(id => document.getElementById(id));

addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') return reset();
  if (e.key === 'p' || e.key === 'P') {
    paused = !paused; msg.textContent = paused ? '일시정지' : ''; return;
  }
  if (over || paused) return;
  if (e.key === 'ArrowLeft') move(-1, 0);
  else if (e.key === 'ArrowRight') move(1, 0);
  else if (e.key === 'ArrowDown') move(0, 1);
  else if (e.key === 'ArrowUp') {
    const m = piece.m; piece.m = rotate(m);
    if (collide(piece)) piece.m = m;          // 벽차기 없음, 실패하면 원복
  } else if (e.key === ' ') { while (move(0, 1)); }
  else return;
  e.preventDefault();
  draw();
});

// 자체 점검: 회전 + 줄 삭제
(function selfTest() {
  const r = rotate([[1,0,0],[1,1,1]]);
  console.assert(JSON.stringify(r) === JSON.stringify([[1,1],[0,1],[0,1]]), 'rotate');
  const save = grid;
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  grid[ROWS - 1].fill('#fff');
  console.assert(clearLines() === 1 && grid.every(r => r.every(c => !c)), 'clearLines');
  grid = save;
})();

reset();
requestAnimationFrame(loop);
</script>
